    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .map-legend .lg-hit:hover { background: rgba(0,97,155,.12); text-decoration: underline; }
  .map-legend .lg-more { color: #999; font-style: italic; padding: 2px 3px; font-size: 11px; }

  .lg-sw { display: inline-flex; align-items: center; justify-content: center;
           width: 14px; height: 14px; flex: 0 0 14px; }
  .lg-sw svg { width: 9px; height: 9px; }
  .lg-pin { border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  .lg-badge { width: 13px; height: 15px; flex-basis: 13px; border-radius: 2px 2px 5px 5px;
              border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }

  /* transient highlight ring drawn on the feature you jumped to */
  .lg-flash { animation: lgFlash 1.6s ease-out 1; }
  @keyframes lgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = CSS;
  document.head.appendChild(styleEl);

  const MAX_LIST = 250;          // cap the expanded list so huge extents stay usable
  const ZOOM_TO_POINT = 17;      // zoom level used when jumping to a point feature

  // Swatch helpers
  const dot   = c => `<i class="lg-sw" style="background:${c};border-radius:50%;border:1px solid #004561"></i>`;
  const fill  = c => `<i class="lg-sw" style="background:${c};border:1px solid #000"></i>`;
  const line  = c => `<i class="lg-sw" style="border-top:2px solid ${c};height:0"></i>`;
  const pin   = (c, g) => `<i class="lg-sw lg-pin" style="background:${c}">${g}</i>`;
  const badge = (c, g) => `<i class="lg-sw lg-badge" style="background:${c}">${g}</i>`;

  // Works out what is actually on screen: collects the features a layer has
  // already loaded that fall inside the current bounds. Handles points
  // (getLatLng) and polygons (getBounds), and returns [{ name, latlng, bounds }],
  // which feeds both the count and the expanded list.
  function collect(lyr, matchFn, nameFn, fallbackName) {
    if (!lyr || !map.hasLayer(lyr) || typeof lyr.eachFeature !== 'function') return [];
    const b = map.getBounds();
    const out = [];
    try {
      lyr.eachFeature(f => {
        const props = f.feature ? f.feature.properties : null;
        if (matchFn && !matchFn(props)) return;
        let latlng = null, bounds = null;
        if (typeof f.getLatLng === 'function') {
          latlng = f.getLatLng();
          if (!b.contains(latlng)) return;
        } else if (typeof f.getBounds === 'function') {
          bounds = f.getBounds();
          if (!b.intersects(bounds)) return;
          latlng = bounds.getCenter();
        } else return;
        let name = '';
        try { name = String(nameFn ? (nameFn(props) || '') : '').trim(); } catch (e) { name = ''; }
        out.push({ name: name || fallbackName || 'Unnamed', latlng, bounds });
      });
    } catch (e) { /* layer still loading */ }
    return out;
  }

  // Drops duplicates (footprint plus point for the same building, repeated
  // polygons) and sorts alphabetically so the list is predictable.
  const tidy = list => {
    const seen = new Set(), out = [];
    for (const e of list) {
      const key = e.name + '|' + e.latlng.lat.toFixed(4) + ',' + e.latlng.lng.toFixed(4);
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(e);
    }
    return out.sort((a, b) => a.name.localeCompare(b.name));
  };

  // Name readers, one per layer
  const schoolName = p => {
    const raw = pick(p, 'NAME', 'Name');
    if (!raw) return '';
    try { return typeof formatSchoolName === 'function' ? formatSchoolName(raw) : properCase(raw); }
    catch (e) { return properCase(raw); }
  };
  const hospitalName = p => properCase(pick(p, 'NAME', 'Name', 'FACILITY', 'Facility', 'FACILITY_N') || '');
  const urgentName   = p => properCase(pick(p, 'Name', 'NAME', 'FACILITY', 'Facility', 'FACILITY_N') || '');
  const localLEName  = p => pick(p, 'NAME', 'Name', 'DEPARTMENT', 'Department', 'DEPT_NAME') || '';
  const fireName     = p => pick(p, 'NAME', 'Name', 'DEPARTMENT', 'Department', 'DEPT_NAME', 'STATION', 'Station', 'FIRE_DEPT') || '';
  const districtName = p => pick(p, 'Name', 'NAME', 'Label') || '';
  const isdName      = p => pick(p, 'Label', 'NAME', 'Name') || '';

  // Schools live in two layers (points below FOOTPRINT_ZOOM, footprints above),
  // so this gathers across both - only one is ever on the map at a time.
  const schoolKind = kind => p => {
    const t = String((p && (p.TYPE || p.type)) || '').toLowerCase().trim();
    return kind === 'other' ? (t !== 'public' && t !== 'private') : t === kind;
  };
  const schoolsInView = kind => tidy([
    ...collect(schools, schoolKind(kind), schoolName, 'Unnamed school'),
    ...collect(footprints, schoolKind(kind), schoolName, 'Unnamed school')
  ]);

  const hospitalsInView = () => tidy(collect(hospitals, isHospital, hospitalName, 'Hospital'));

  // Legend definition. Order within each group is the display order.
  const GROUPS = [
    { title: 'Schools', items: [
      { key: 'sch-pub',  label: 'Public school',  swatch: () => dot('#3388FF'), list: () => schoolsInView('public') },
      { key: 'sch-priv', label: 'Private school', swatch: () => dot('#FF3333'), list: () => schoolsInView('private') },
      { key: 'sch-oth',  label: 'Unspecified type', swatch: () => dot('#808080'), list: () => schoolsInView('other') }
    ]},
    { title: 'Facilities', items: [
      { key: 'hosp', label: 'Hospital',              swatch: () => pin(HOSPITAL_COLOR, HOSPITAL_GLYPH),
        list: () => hospitalsInView() },
      { key: 'uc',   label: 'Urgent care',            swatch: () => badge(URGENT_CARE_COLOR, URGENT_CARE_GLYPH),
        list: () => tidy(collect(urgentCare, null, urgentName, 'Urgent Care')) },
      { key: 'le',   label: 'Local law enforcement', swatch: () => badge('#8a6b12', LOCAL_LE_GLYPH),
        list: () => tidy(collect(localLawEnforcement, null, localLEName, 'Local Law Enforcement')) },
      { key: 'fire', label: 'Fire station',          swatch: () => badge(FIRE_COLOR, FIRE_GLYPH),
        list: () => tidy(collect(fireStations, null, fireName, 'Fire Station')) }
    ]},
    { title: 'Boundaries', items: [
      { key: 'sd',  label: 'School district',       swatch: () => line('rgba(0,0,0,.45)'),
        list: () => tidy(collect(schoolDistricts, null, districtName, 'School district')), showCount: false },
      { key: 'isd', label: 'Intermediate district', swatch: () => fill('rgba(120,160,200,.45)'),
        list: () => tidy(collect(intermediateDistricts, null, isdName, 'Intermediate district')),
        showCount: false, expandable: false }
    ]}
  ];

  // The control itself
  const legendControl = L.control({ position: 'bottomright' });
  legendControl.onAdd = function () {
    this._div = L.DomUtil.create('div', 'map-legend');
    L.DomEvent.disableClickPropagation(this._div);
    L.DomEvent.disableScrollPropagation(this._div);
    return this._div;
  };
  legendControl.addTo(map);

  const openKeys = new Set();   // which rows are expanded (survives re-render)
  const entries = {};           // key -> current list of features in view

  function renderLegend() {
    const el = legendControl._div;
    if (!el) return;

    const blocks = GROUPS.map(g => {
      const rows = g.items
        .map(it => {
          const list = it.list();
          entries[it.key] = list;
          return { it, list };
        })
        .filter(r => r.list.length > 0)
        .map(r => {
          const it = r.it, n = r.list.length;
          const expandable = it.expandable !== false;

          // Non-expandable rows (Intermediate district): plain swatch and label
          // line, no caret, no click-to-expand, no sub-list.
          if (!expandable) {
            return `<div class="lg-row">
                ${it.swatch()}<span class="lg-label">${it.label}</span>
                ${it.showCount === false ? '' : `<span class="lg-count">${n}</span>`}
              </div>`;
          }

          const shown = r.list.slice(0, MAX_LIST);
          const sub = shown.map((e, i) =>
              `<button type="button" class="lg-hit" data-key="${it.key}" data-i="${i}" title="${esc(e.name)}">${esc(e.name)}</button>`
            ).join('') +
            (n > shown.length ? `<div class="lg-more">+ ${n - shown.length} more - zoom in to list</div>` : '');
          return `<div class="lg-item${openKeys.has(it.key) ? ' open' : ''}" data-key="${it.key}">
              <div class="lg-row lg-clickable" data-toggle="${it.key}">
                ${it.swatch()}<span class="lg-label">${it.label}</span>
                ${it.showCount === false ? '' : `<span class="lg-count">${n}</span>`}
                <span class="lg-caret">&#9654;</span>
              </div>
              <div class="lg-sub">${sub}</div>
            </div>`;
        });
      return rows.length ? { title: g.title, html: rows.join('') } : null;
    }).filter(Boolean);

    // Schools first when any are in view, otherwise natural order.
    blocks.sort((a, b) => (b.title === 'Schools') - (a.title === 'Schools'));

    el.innerHTML = blocks.length
      ? blocks.map(b => `<h5>${b.title}</h5>${b.html}`).join('')
      : '<div class="lg-empty">Zoom in to see map features</div>';
  }

  // Interaction. Delegated so it survives the innerHTML rebuild that happens on
  // every map move.
  legendControl._div.addEventListener('click', ev => {
    ev.stopPropagation();
    const toggle = ev.target.closest('[data-toggle]');
    if (toggle) {
      const key = toggle.getAttribute('data-toggle');
      const item = toggle.parentElement;
      if (openKeys.has(key)) { openKeys.delete(key); item.classList.remove('open'); }
      else { openKeys.add(key); item.classList.add('open'); }
      return;
    }
    const hit = ev.target.closest('.lg-hit');
    if (!hit) return;
    const list = entries[hit.getAttribute('data-key')];
    const entry = list && list[Number(hit.getAttribute('data-i'))];
    if (entry) zoomToEntry(entry);
  });

  // Zooms to a feature, flashes a ring on it, then fires the normal map click
  // handler at that spot so its popup opens.
  let flashMarker = null;
  function zoomToEntry(entry) {
    const isPolygon = !!entry.bounds && !entry.bounds.getNorthEast().equals(entry.bounds.getSouthWest());

    let done = false;
    const afterMove = () => {
      if (done) return;
      done = true;
      map.off('moveend', onMove);
      if (flashMarker) map.removeLayer(flashMarker);
      flashMarker = L.circleMarker(entry.latlng, {
        radius: 16, color: '#00619b', weight: 3, opacity: 1,
        fillColor: '#00619b', fillOpacity: .12, interactive: false, className: 'lg-flash'
      }).addTo(map);
      setTimeout(() => { if (flashMarker) { map.removeLayer(flashMarker); flashMarker = null; } }, 1600);
      map.fire('click', { latlng: entry.latlng });   // reuse the existing popup logic
    };

    const onMove = () => setTimeout(afterMove, 250);   // let the layers refresh first
    map.on('moveend', onMove);

    if (isPolygon) map.fitBounds(entry.bounds, { padding: [30, 30] });
    else map.setView(entry.latlng, Math.max(map.getZoom(), ZOOM_TO_POINT));

    // setView/fitBounds do nothing when the view is already there, so no moveend
    // would ever fire - this backstop makes sure the popup still opens.
    setTimeout(afterMove, 900);
  }

  // Refresh triggers
  let pending = null;
  const scheduleLegend = () => {
    clearTimeout(pending);
    pending = setTimeout(renderLegend, 200);   // debounce: layers fire 'load' in bursts
  };

  map.on('moveend zoomend layeradd layerremove', scheduleLegend);
  [schools, footprints, hospitals, urgentCare, localLawEnforcement,
   fireStations, schoolDistricts, intermediateDistricts].forEach(l => l.on('load', scheduleLegend));

  renderLegend();
})();

// ============================================================================
// SEARCH WIDGET
// ============================================================================
// Text search across every dataset on this map - schools, hospitals, urgent
// care, local law enforcement, fire stations, PSAP boundaries, EMHSD zones,
// state police zones, and school / intermediate districts - which zooms to the
// chosen result and opens its popup. Reuses the popup builders and the tolerant
// pick() lookup from above, so it handles the same field-name inconsistencies.
//
// Villages, Minor Civil Divisions and Counties are left out of search because
// those three are statewide services, so searching them could zoom to a
// same-named place outside Washtenaw County entirely.
// ============================================================================
(function initSearch() {

  const MIN_CHARS = 2;
  const DEBOUNCE_MS = 350;
  const PER_LAYER_LIMIT = 8;

  // Swatch helpers, same as the legend's but kept local to this IIFE
  const dot   = c => `<i class="lg-sw" style="background:${c};border-radius:50%;border:1px solid #004561"></i>`;
  const fill  = c => `<i class="lg-sw" style="background:${c};border:1px solid #000"></i>`;
  const line  = c => `<i class="lg-sw" style="border-top:2px solid ${c};height:0"></i>`;
  const pin   = (c, g) => `<i class="lg-sw lg-pin" style="background:${c}">${g}</i>`;
  const badge = (c, g) => `<i class="lg-sw lg-badge" style="background:${c}">${g}</i>`;

  // Server-side name search, written to survive the field-name inconsistency
  // noted at the top of the file: try every candidate field in one OR'd clause,
  // and if the service rejects it (one unrecognised field errors the whole
  // query), fall back to querying each candidate field alone and merge whatever
  // succeeds.
  const runWhere = (lyr, where) => new Promise(resolve => {
    try {
      lyr.query().where(where).limit(PER_LAYER_LIMIT).returnGeometry(true)
        .run((err, fc) => resolve(err ? null : (fc && fc.features) || []));
    } catch (e) { resolve(null); }
  });

  function nameClause(fields, term) {
    const t = term.replace(/'/g, "''").toUpperCase();
    return fields.map(f => `UPPER(${f}) LIKE '%${t}%'`).join(' OR ');
  }

  function searchOneLayer(lyr, fields, term) {
    return runWhere(lyr, nameClause(fields, term)).then(res => {
      if (res !== null) return res;
      return Promise.all(fields.map(f => runWhere(lyr, nameClause([f], term))))
        .then(lists => lists.filter(Boolean).reduce((a, b) => a.concat(b), []));
    });
  }

  // Finds an anchor point guaranteed to sit inside a polygon search result.
  // Bounding-box centres can land outside very concave shapes (a bent district
  // line, a notch cut into a zone), which would put the search popup off the
  // feature entirely. These helpers try the area centroid first, then the widest
  // interior scanline if the centroid itself is outside (a C-shaped boundary).
  const ringArea = ring => {
    let a = 0;
    for (let i = 0; i < ring.length; i++) {
      const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
      a += x1 * y2 - x2 * y1;
    }
    return a / 2;
  };

  const pointInRing = (pt, ring) => {
    const [px, py] = pt;
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      const hit = ((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  };

  // Polygon -> [{outer, holes}]; MultiPolygon -> one entry per part.
  const extractParts = g => g.type === 'Polygon'
    ? [{ outer: g.coordinates[0], holes: g.coordinates.slice(1) }]
    : g.type === 'MultiPolygon'
      ? g.coordinates.map(c => ({ outer: c[0], holes: c.slice(1) }))
      : [];

  function pointOnSurface(geometry) {
    const parts = extractParts(geometry);
    if (!parts.length) return null;

    // Work with the largest part by area for MultiPolygon features.
    let part = parts[0], bestArea = Math.abs(ringArea(parts[0].outer));
    for (let i = 1; i < parts.length; i++) {
      const a = Math.abs(ringArea(parts[i].outer));
      if (a > bestArea) { bestArea = a; part = parts[i]; }
    }
    const { outer, holes } = part;
    const inside = pt => pointInRing(pt, outer) && !holes.some(h => pointInRing(pt, h));

    // 1) area centroid of the outer ring - correct and cheapest for the
    // convex-ish shapes that make up most of these datasets.
    let cx = 0, cy = 0, a2 = 0;
    for (let i = 0; i < outer.length; i++) {
      const [x1, y1] = outer[i], [x2, y2] = outer[(i + 1) % outer.length];
      const cross = x1 * y2 - x2 * y1;
      a2 += cross; cx += (x1 + x2) * cross; cy += (y1 + y2) * cross;
    }
    if (a2 !== 0) {
      cx /= (3 * a2); cy /= (3 * a2);
      if (inside([cx, cy])) return L.latLng(cy, cx);
    }

    // 2) fall back to the midpoint of the widest interior scanline, which is
    // guaranteed to be inside a concave shape where the centroid isn't.
    let minY = Infinity, maxY = -Infinity;
    for (const [, y] of outer) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
    const STEPS = 40;
    let best = null, bestLen = -1;
    for (let s = 1; s < STEPS; s++) {
      const y = minY + (maxY - minY) * (s / STEPS);
      const xs = [];
      const collect = ring => {
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [x1, y1] = ring[j], [x2, y2] = ring[i];
          if ((y1 > y) !== (y2 > y)) xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
        }
      };
      collect(outer);
      holes.forEach(collect);
      xs.sort((a, b) => a - b);
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const len = xs[i + 1] - xs[i];
        if (len > bestLen) { bestLen = len; best = [(xs[i] + xs[i + 1]) / 2, y]; }
      }
    }
    if (best) return L.latLng(best[1], best[0]);

    // 3) last resort - a vertex is always on the boundary of the feature.
    return L.latLng(outer[0][1], outer[0][0]);
  }

  // GeoJSON feature -> { latlng, bounds }. Points use their own coordinate;
  // polygons use the interior point from pointOnSurface above so the popup always
  // lands on the selected shape, while `bounds` keeps the full extent for the
  // zoom / fit.
  function featureGeom(feature) {
    const g = feature && feature.geometry;
    if (!g) return null;
    if (g.type === 'Point') {
      const [lng, lat] = g.coordinates;
      return { latlng: L.latLng(lat, lng), bounds: null };
    }
    try {
      const b = L.geoJSON(feature).getBounds();
      if (!b.isValid()) return null;
      const anchor = pointOnSurface(g);
      return { latlng: anchor || b.getCenter(), bounds: b };
    } catch (e) { return null; }
  }

  // Address and city line shown as a subtitle under a search result's name,
  // using the same fields the popups already read for these datasets.
  function cityAddressOf(p) {
    const addr = properCase(pick(p, 'StreetAddr', 'ADDRESS', 'Address', 'STREET', 'Street') || '');
    const city = properCase(pick(p, 'CITY', 'City') || '');
    return [addr, city].filter(Boolean).join(', ');
  }

  // One entry per searchable dataset. `layers` (plural) lets Schools fold its
  // point and footprint services into a single result group, and
  // `dedupeKey(props, geom)` can override duplicate detection within a group.
  const SEARCH_LAYERS = [
    { key: 'hosp', label: 'Hospitals', layers: [hospitals],
      fields: ['NAME', 'Name', 'FACILITY', 'Facility', 'FACILITY_N'],
      // The service holds other facility types too; only hospitals are listed.
      filter: isHospital,
      nameOf: p => properCase(pick(p, 'NAME', 'Name', 'FACILITY', 'Facility', 'FACILITY_N') || 'Hospital'),
      detailOf: cityAddressOf,
      swatch: () => pin(HOSPITAL_COLOR, HOSPITAL_GLYPH),
      popup: (latlng, props, popup) => buildHospitalPopup(latlng, props, popup) },

    { key: 'uc', label: 'Urgent Care', layers: [urgentCare],
      fields: ['Name', 'NAME', 'FACILITY', 'Facility'],
      nameOf: p => properCase(pick(p, 'Name', 'NAME', 'FACILITY', 'Facility') || 'Urgent Care'),
      detailOf: cityAddressOf,
      swatch: () => badge(URGENT_CARE_COLOR, URGENT_CARE_GLYPH),
      popup: (latlng, props, popup) => buildUrgentCarePopup(latlng, props, popup) },

    { key: 'le', label: 'Local Law Enforcement', layers: [localLawEnforcement],
      fields: ['NAME', 'Name', 'DEPARTMENT', 'Department'],
      nameOf: p => pick(p, 'NAME', 'Name', 'DEPARTMENT', 'Department') || 'Local Law Enforcement',
      detailOf: cityAddressOf,
      swatch: () => badge('#8a6b12', LOCAL_LE_GLYPH),
      popup: (latlng, props, popup) => buildLocalLawEnforcementPopup(latlng, props, popup) },

    { key: 'fire', label: 'Fire Stations', layers: [fireStations],
      fields: ['NAME', 'Name', 'DEPARTMENT', 'Department', 'DEPT_NAME', 'STATION', 'Station', 'FIRE_DEPT'],
      nameOf: p => pick(p, 'NAME', 'Name', 'DEPARTMENT', 'Department', 'DEPT_NAME', 'STATION', 'Station', 'FIRE_DEPT') || 'Fire Station',
      detailOf: cityAddressOf,
      swatch: () => badge(FIRE_COLOR, FIRE_GLYPH),
      popup: (latlng, props, popup) => buildFirePopup(latlng, props, popup) },

    { key: 'school', label: 'Schools', layers: [schools, footprints],
      fields: ['NAME', 'Name'],
      nameOf: p => formatSchoolName(pick(p, 'NAME', 'Name')),
      detailOf: cityAddressOf,
      swatch: p => dot(getColor(p)),
      // Both services carry every school and their geometries never line up
      // exactly (point vs polygon centroid), so the default coordinate key would
      // let the same school through twice. Match on name + street + city instead,
      // falling back to a coarse ~1 km cell for records with no address.
      dedupeKey: (p, geom) => {
        const nm = formatSchoolName(pick(p, 'NAME', 'Name')).toLowerCase();
        const street = String(pick(p, 'STREET', 'Street', 'StreetAddr', 'ADDRESS', 'Address') || '')
          .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        const city = String(pick(p, 'CITY', 'City') || '').toLowerCase().trim();
        return street || city
          ? `${nm}|${street}|${city}`
          : `${nm}|${geom.latlng.lat.toFixed(2)},${geom.latlng.lng.toFixed(2)}`;
      },
      popup: (latlng, props, popup) => buildFootprintPopup(latlng, props, popup) },

    { key: 'sd', label: 'School Districts', layers: [schoolDistricts],
      fields: ['Name', 'NAME'],
      nameOf: p => pick(p, 'Name', 'NAME') || 'School District',
      swatch: () => line('rgba(0,0,0,.45)'),
      popup: (latlng, props, popup) => buildDistrictPopup(latlng, popup) },

    { key: 'isd', label: 'Intermediate School Districts', layers: [intermediateDistricts],
      fields: ['NAME', 'Label', 'Name'],
      nameOf: p => formatDistrictIU(pick(p, 'Label', 'NAME', 'Name') || 'Intermediate District'),
      swatch: () => fill('rgba(120,160,200,.6)'),
      popup: (latlng, props, popup) => setIfOpen(popup, card('Intermediate School District',
        table([ row('Name', formatDistrictIU(pick(props, 'Label', 'NAME', 'Name') || '')) ]))) },

    { key: 'psap', label: 'PSAP Boundaries', layers: [psapBoundaries],
      fields: ['DISPNAME'],
      nameOf: p => properCase(pick(p, 'DISPNAME') || 'PSAP Zone'),
      swatch: () => fill('rgba(150,150,150,.5)'),
      popup: (latlng, props, popup) => setIfOpen(popup, card('PSAP Boundary',
        table([ row('Name', properCase(pick(props, 'DISPNAME') || '')) ]))) },

    { key: 'emhsd', label: 'Emergency Management & Homeland Security', layers: [emshdZones],
      fields: ['EMHSD'],
      nameOf: p => 'EMHSD District #' + (pick(p, 'EMHSD') || '?'),
      swatch: () => fill('rgba(150,150,150,.5)'),
      popup: (latlng, props, popup) => setIfOpen(popup, card('EMHSD District',
        table([ row('District #', pick(props, 'EMHSD') || '') ]))) },

    { key: 'spzone', label: 'State Police Zones', layers: [statePoliceZones],
      fields: ['POST_DISTRICT'],
      nameOf: p => properCase(pick(p, 'POST_DISTRICT') || 'Zone'),
      swatch: () => fill('rgba(150,150,150,.5)'),
      popup: (latlng, props, popup) => setIfOpen(popup, card('State Police Zone',
        table([ row('Troop / district', properCase(pick(props, 'POST_DISTRICT') || '')) ]))) }
  ];

  // Runs a search across every dataset, grouped and de-duplicated
  let gen = 0;
  async function runSearch(term) {
    const myGen = ++gen;
    resultsEl.innerHTML = '<div class="ms-empty">Searching\u2026</div>';
    resultsEl.classList.add('open');

    const groups = await Promise.all(SEARCH_LAYERS.map(async cfg => {
      let feats = [];
      try {
        const lists = await Promise.all(cfg.layers.map(lyr => searchOneLayer(lyr, cfg.fields, term)));
        feats = lists.reduce((a, b) => a.concat(b), []);
      } catch (e) { feats = []; }

      const seen = new Set(), entries = [];
      for (const f of feats) {
        const geom = featureGeom(f);
        if (!geom) continue;
        if (cfg.filter && !cfg.filter(f.properties)) continue;   // e.g. hospitals only
        const name = cfg.nameOf(f.properties) || 'Unnamed';
        // Default key is name plus rounded coordinate; a config can override it
        // where that isn't enough (see Schools).
        const key = cfg.dedupeKey
          ? cfg.dedupeKey(f.properties, geom)
          : name.toLowerCase() + '|' + geom.latlng.lat.toFixed(3) + ',' + geom.latlng.lng.toFixed(3);
        if (seen.has(key)) continue;
        seen.add(key);
        entries.push({ name, properties: f.properties, latlng: geom.latlng, bounds: geom.bounds, cfg });
        if (entries.length >= PER_LAYER_LIMIT) break;
      }
      return entries.length ? { label: cfg.label, entries } : null;
    }));

    if (myGen !== gen) return;   // a newer search superseded this one
    renderResults(term, groups.filter(Boolean));
  }

  // currentEntriesTerm records which search term currentEntries actually
  // reflects, so a fast Enter press can tell fresh results from stale ones left
  // over from whatever was typed before (see the keydown handler below).
  let currentEntries = [];
  let currentEntriesTerm = '';
  function renderResults(term, groups) {
    currentEntriesTerm = term;
    if (!term) {
      resultsEl.innerHTML = '';
      resultsEl.classList.remove('open');
      currentEntries = [];
      return;
    }
    if (!groups.length) {
      resultsEl.innerHTML = `<div class="ms-empty">No matches for "${esc(term)}"</div>`;
      resultsEl.classList.add('open');
      currentEntries = [];
      return;
    }
    currentEntries = [];
    resultsEl.innerHTML = groups.map(g => {
      const rows = g.entries.map(e => {
        currentEntries.push(e);
        const i = currentEntries.length - 1;
        const detail = e.cfg.detailOf ? e.cfg.detailOf(e.properties) : '';
        const detailHtml = detail ? `<span class="ms-detail">${esc(detail)}</span>` : '';
        return `<button type="button" class="ms-row" data-i="${i}">${e.cfg.swatch(e.properties)}<span class="ms-text"><span class="ms-name">${esc(e.name)}</span>${detailHtml}</span></button>`;
      }).join('');
      return `<h6>${esc(g.label)}</h6>${rows}`;
    }).join('');
    resultsEl.classList.add('open');
  }

  // Zooms to a result, then hands off to that dataset's popup builder
  function goToResult(entry) {
    // With `animate: false` Leaflet resets the view synchronously before
    // setView/fitBounds even returns, so the popup is always added to a view that
    // has fully settled - otherwise it can land in a corner of the screen
    // mid-zoom.
    if (entry.bounds) map.fitBounds(entry.bounds, { padding: [40, 40], animate: false });
    else map.setView(entry.latlng, Math.max(map.getZoom(), 15), { animate: false });

    openPopup(entry.latlng, entry.bounds ? { maxWidth: 380, maxHeight: 460 } : { maxWidth: 340 },
      'Loading details', popup => entry.cfg.popup(entry.latlng, entry.properties, popup),
      'Could not load details. Try again.');
  }

  // Control shell
  const searchControl = L.control({ position: 'topright' });
  let inputEl, clearEl, resultsEl;
  searchControl.onAdd = function () {
    const div = L.DomUtil.create('div', 'map-search');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    div.innerHTML = `
      <div class="ms-box">
        <input type="text" class="ms-input" placeholder="Search schools, districts, facilities\u2026" aria-label="Search map features" />
        <button type="button" class="ms-clear" hidden aria-label="Clear search">&times;</button>
      </div>
      <div class="ms-results"></div>`;
    inputEl = div.querySelector('.ms-input');
    clearEl = div.querySelector('.ms-clear');
    resultsEl = div.querySelector('.ms-results');

    let debounceTimer = null;
    inputEl.addEventListener('input', () => {
      const term = inputEl.value.trim();
      clearEl.hidden = !term;
      clearTimeout(debounceTimer);
      if (term.length < MIN_CHARS) { renderResults('', []); return; }
      debounceTimer = setTimeout(() => runSearch(term), DEBOUNCE_MS);
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        inputEl.value = '';
        clearEl.hidden = true;
        renderResults('', []);
        inputEl.blur();
      } else if (e.key === 'Enter') {
        const term = inputEl.value.trim();
        if (!term) return;
        clearTimeout(debounceTimer);
        if (term === currentEntriesTerm) {
          // currentEntries already reflects what's typed, so use it directly.
          if (currentEntries[0]) { goToResult(currentEntries[0]); renderResults('', []); }
          inputEl.blur();
        } else {
          // The debounced search for this text hasn't landed yet (or the box was
          // edited since the last render), so currentEntries[0] still belongs to an
          // earlier term. Run the search for the current text immediately instead
          // and act on that top match.
          runSearch(term).then(() => {
            if (currentEntries[0]) { goToResult(currentEntries[0]); renderResults('', []); }
          });
          inputEl.blur();
        }
      }
    });
    clearEl.addEventListener('click', () => {
      inputEl.value = '';
      clearEl.hidden = true;
      renderResults('', []);
      inputEl.focus();
    });
    resultsEl.addEventListener('click', e => {
      // Stopped here, before anything below can touch the DOM: renderResults()
      // clears resultsEl's innerHTML synchronously, which detaches the clicked
      // button before Leaflet's disableClickPropagation can walk up from it,
      // letting the click leak through to the map.
      e.stopPropagation();
      const btn = e.target.closest('.ms-row');
      if (!btn) return;
      const entry = currentEntries[Number(btn.dataset.i)];
      if (!entry) return;
      inputEl.value = entry.name;
      clearEl.hidden = false;
      renderResults('', []);
      goToResult(entry);
    });
    return div;
  };
  searchControl.addTo(map);

})();

// ============================================================================
// DIRECTIONS WIDGET
// ============================================================================
// Leaflet Routing Machine driven by OpenRouteService. A small custom router
// calls the ORS Directions v2 GeoJSON endpoint and reshapes the response into
// what LRM expects, so no extra plugin is needed. Typed addresses are resolved
// with ORS geocoding on the same key, and waypoints can also be picked straight
// off the map.
// ============================================================================

// >>> OPENROUTESERVICE API KEY HERE <<<
const ORS_API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImRhYWUzZDEzM2QyOTQyODlhNWQ4MmUzYTAyZTRhYWU0IiwiaCI6Im11cm11cjY0In0=';

(function initDirections() {

  const ORS = 'https://api.openrouteservice.org';
  const PROFILES = [
    ['driving-car', 'Drive'],
    ['foot-walking', 'Walk'],
    ['cycling-regular', 'Bike']
  ];
  // Geocoding is clamped to a Michigan-sized envelope so "Lincoln Elementary"
  // doesn't resolve to Nebraska. Deliberately wider than the county so an address
  // just outside Washtenaw still works as a start or end.
  const MI_RECT = { min_lon: -90.6, min_lat: 41.5, max_lon: -82.0, max_lat: 48.4 };
  const MAX_STOPS = 8;

  const hasKey = () => String(ORS_API_KEY || '').trim().length > 0;

  // Formatting helpers
  const fmtDist = m => m >= 160.9
    ? (m / MI).toFixed(m / MI < 10 ? 2 : 1) + ' mi'
    : Math.round(m * 3.28084) + ' ft';

  const fmtTime = s => {
    const mins = Math.round(s / 60);
    return mins < 60 ? mins + ' min' : Math.floor(mins / 60) + ' hr ' + (mins % 60) + ' min';
  };

  const fmtLatLng = ll => ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5);

  // "42.3, -83.05" typed into a field is used as-is rather than geocoded.
  const parseLatLng = text => {
    const m = String(text || '').match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (!m) return null;
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    return (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) ? L.latLng(lat, lng) : null;
  };

  // ORS router for Leaflet Routing Machine. LRM calls route(waypoints, callback,
  // context) and expects callback(err, [route]).
  const orsRouter = {
    options: { profile: 'driving-car' },

    route(waypoints, callback, context) {
      if (!hasKey()) {
        return callback.call(context, {
          status: -1, message: 'No OpenRouteService API key set - add one to ORS_API_KEY.'
        });
      }
      const coords = waypoints.map(w => [w.latLng.lng, w.latLng.lat]);

      fetch(`${ORS}/v2/directions/${this.options.profile}/geojson`, {
        method: 'POST',
        headers: { Authorization: String(ORS_API_KEY).trim(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ coordinates: coords, instructions: true, units: 'm' })
      })
        .then(r => r.json().then(j => ({ ok: r.ok, j })).catch(() => ({ ok: false, j: null })))
        .then(({ ok, j }) => {
          if (!ok || !j || !j.features || !j.features.length) {
            const e = j && j.error;
            const msg = (e && (e.message || e)) || 'No route found between those points.';
            return callback.call(context, { status: -1, message: String(msg) });
          }
          callback.call(context, null, [toRoute(j.features[0], waypoints)]);
        })
        .catch(err => callback.call(context, {
          status: -1, message: err && err.message ? err.message : 'Routing request failed.'
        }));
    }
  };

  // Turns an ORS GeoJSON feature into the route object LRM wants
  function toRoute(feature, waypoints) {
    const line = feature.geometry.coordinates.map(c => L.latLng(c[1], c[0]));
    const props = feature.properties || {};
    const instructions = [];

    (props.segments || []).forEach(seg => (seg.steps || []).forEach(s => instructions.push({
      distance: s.distance || 0,
      time: s.duration || 0,
      text: s.instruction || '',
      index: (s.way_points && s.way_points[0]) || 0
    })));

    const idx = props.way_points && props.way_points.length
      ? props.way_points
      : [0, line.length - 1];

    return {
      name: '',
      coordinates: line,
      instructions,
      summary: {
        totalDistance: (props.summary && props.summary.distance) || 0,
        totalTime: (props.summary && props.summary.duration) || 0
      },
      inputWaypoints: waypoints,
      waypoints: idx.map(i => ({ latLng: line[Math.min(i, line.length - 1)] })),
      waypointIndices: idx
    };
  }

  // Geocoding through ORS / Pelias
  function geocode(text) {
    if (!hasKey()) return Promise.resolve(null);
    const q = new URLSearchParams({
      api_key: String(ORS_API_KEY).trim(),
      text, size: '1',
      'boundary.rect.min_lon': MI_RECT.min_lon,
      'boundary.rect.min_lat': MI_RECT.min_lat,
      'boundary.rect.max_lon': MI_RECT.max_lon,
      'boundary.rect.max_lat': MI_RECT.max_lat
    });
    return fetch(`${ORS}/geocode/search?${q}`)
      .then(r => r.json())
      .then(j => {
        const f = j && j.features && j.features[0];
        if (!f || !f.geometry) return null;
        return {
          latlng: L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]),
          label: (f.properties && (f.properties.label || f.properties.name)) || text
        };
      })
      .catch(() => null);
  }

  // Widget state. stops[i] = { latlng, label }, with latlng null until the stop
  // is picked or geocoded.
  let stops = [{ latlng: null, label: '' }, { latlng: null, label: '' }];
  let pickIndex = null;         // which stop the next map click fills, if any
  let profile = PROFILES[0][0];
  let panelEl = null, statusEl = null, summaryEl = null, stepsEl = null, rowsEl = null;

  const letter = i => String.fromCharCode(65 + i);

  // Routing control. Draws the line and the draggable waypoint markers only -
  // the itinerary renders into our own panel from routesfound, so LRM's own panel
  // stays hidden.
  let routingControl = null;

  // Built on first use, so a problem here can't stop the panel rendering.
  function routing() {
    if (routingControl) return routingControl;
    if (!window.L || !L.Routing || !L.Routing.control) {
      setStatus('Leaflet Routing Machine did not load - check the script tag.', true);
      return null;
    }
    try {
      routingControl = L.Routing.control({
        router: orsRouter,
        waypoints: [],
        show: false,
        addWaypoints: false,
        routeWhileDragging: false,
        fitSelectedRoutes: true,
        lineOptions: {
          addWaypoints: false,
          styles: [
            { color: '#fff', opacity: 0.9, weight: 9 },
            { color: '#00619b', opacity: 0.95, weight: 5 }
          ]
        },
        createMarker: (i, wp) => L.marker(wp.latLng, {
          draggable: true,
          icon: L.divIcon({
            className: 'dw-wp-icon',
            html: `<span class="dw-wp">${letter(i)}</span>`,
            iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -12]
          })
        })
      }).addTo(map);
    } catch (err) {
      setStatus('Routing control failed to initialise: ' + (err && err.message), true);
      console.error(err);
      return null;
    }

    routingControl.on('routesfound', e => {
      const r = e.routes && e.routes[0];
      if (!r) return;
      setStatus('');
      summaryEl.innerHTML =
        `${esc(fmtDist(r.summary.totalDistance))} &middot; ${esc(fmtTime(r.summary.totalTime))}` +
        `<span>${esc(PROFILES.find(p => p[0] === profile)[1])} route via OpenRouteService</span>`;
      stepsEl.innerHTML = r.instructions.map(s =>
        `<li>${esc(s.text)}<br><span class="dw-stepdist">${esc(fmtDist(s.distance))}</span></li>`
      ).join('');
    });

    routingControl.on('routingerror', e => {
      setStatus((e.error && e.error.message) || 'Could not calculate a route.', true);
      summaryEl.innerHTML = '';
      stepsEl.innerHTML = '';
    });

    routingControl.on('waypointschanged', e => {
      (e.waypoints || []).forEach((w, i) => {
        if (!w.latLng || !stops[i]) return;
        if (stops[i].latlng && stops[i].latlng.equals(w.latLng)) return;
        stops[i] = { latlng: w.latLng, label: fmtLatLng(w.latLng) };
      });
      renderRows();
    });

    return routingControl;
  }

  // Map-click waypoint picking. Called from the main map click handler before any
  // popup logic runs; returning true means this click belonged to the widget.
  window.__dwPickClick = latlng => {
    if (pickIndex === null) return false;
    const i = pickIndex;
    setPickMode(null);
    stops[i] = { latlng, label: fmtLatLng(latlng) };
    renderRows();
    setStatus('');
    if (stops.every(s => s.latlng)) route();
    return true;
  };

  function setPickMode(i) {
    pickIndex = i;
    const c = map.getContainer();
    if (i === null) L.DomUtil.removeClass(c, 'dw-picking');
    else L.DomUtil.addClass(c, 'dw-picking');
    if (rowsEl) rowsEl.querySelectorAll('.dw-pick').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.i) === i);
    });
    if (i !== null) setStatus('Click the map to set stop ' + letter(i) + '.');
  }

  function setStatus(msg, isError) {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('dw-err', !!isError);
  }

  // Routing
  function clearRoute() {
    if (routingControl) routingControl.setWaypoints([]);
    summaryEl.innerHTML = '';
    stepsEl.innerHTML = '';
  }

  function route() {
    if (stops.some(s => !s.latlng)) return setStatus('Set at least a start and an end point.', true);
    if (!hasKey()) return setStatus('No OpenRouteService API key set - add one to ORS_API_KEY.', true);
    const rc = routing();
    if (!rc) return;
    orsRouter.options.profile = profile;
    setStatus('Finding route\u2026');
    rc.setWaypoints(stops.map(s => s.latlng));
  }

  // Resolves any typed-but-unresolved fields, then routes.
  async function submit() {
    setStatus('');
    for (let i = 0; i < stops.length; i++) {
      const input = rowsEl.querySelector(`.dw-input[data-i="${i}"]`);
      const text = input ? input.value.trim() : '';
      if (!text) { stops[i].latlng = null; continue; }
      if (stops[i].latlng && stops[i].label === text) continue;

      const coord = parseLatLng(text);
      if (coord) { stops[i] = { latlng: coord, label: fmtLatLng(coord) }; continue; }

      setStatus('Looking up "' + text + '"\u2026');
      const hit = await geocode(text);
      if (!hit) {
        setStatus(hasKey()
          ? 'Could not find "' + text + '". Try a fuller address, or use the pin button to click it on the map.'
          : 'No OpenRouteService API key set - add one to ORS_API_KEY.', true);
        return;
      }
      stops[i] = { latlng: hit.latlng, label: hit.label };
    }
    renderRows();
    route();
  }

  // Panel rendering
  function renderRows() {
    if (!rowsEl) return;
    rowsEl.innerHTML = stops.map((s, i) => `
      <div class="dw-row">
        <span class="dw-letter">${letter(i)}</span>
        <input type="text" class="dw-input" data-i="${i}"
               placeholder="${i === 0 ? 'Start' : i === stops.length - 1 ? 'Destination' : 'Stop'} - address, place, or lat, lng"
               value="${esc(s.label)}" />
        <button type="button" class="dw-mini dw-pick" data-i="${i}" title="Pick on map">&#128205;</button>
        ${stops.length > 2
          ? `<button type="button" class="dw-mini dw-del" data-i="${i}" title="Remove stop">&times;</button>`
          : ''}
      </div>`).join('');
    if (pickIndex !== null) setPickMode(pickIndex);
  }

  const control = L.control({ position: 'topleft' });
  control.onAdd = function () {
    const wrap = L.DomUtil.create('div', 'leaflet-bar-none');
    L.DomEvent.disableClickPropagation(wrap);
    L.DomEvent.disableScrollPropagation(wrap);
    wrap.innerHTML = `
      <button type="button" class="dw-launch">&#10142; Directions</button>
      <div class="map-directions" hidden>
        <div class="dw-head">
          <span class="dw-title">Directions</span>
          <button type="button" class="dw-x" aria-label="Close">&times;</button>
        </div>
        <div class="dw-rows"></div>
        <button type="button" class="dw-add">+ Add stop</button>
        <div class="dw-controls">
          <select class="dw-profile">
            ${PROFILES.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('')}
          </select>
          <button type="button" class="dw-btn dw-go">Get directions</button>
          <button type="button" class="dw-btn dw-ghost dw-clear">Clear</button>
        </div>
        <div class="dw-status"></div>
        <div class="dw-summary"></div>
        <ol class="dw-steps"></ol>
      </div>`;

    const launch = wrap.querySelector('.dw-launch');
    panelEl = wrap.querySelector('.map-directions');
    rowsEl = wrap.querySelector('.dw-rows');
    statusEl = wrap.querySelector('.dw-status');
    summaryEl = wrap.querySelector('.dw-summary');
    stepsEl = wrap.querySelector('.dw-steps');

    const open = on => {
      panelEl.hidden = !on;
      launch.hidden = on;
      if (!on) setPickMode(null);
    };

    launch.addEventListener('click', () => open(true));
    wrap.querySelector('.dw-x').addEventListener('click', () => open(false));

    wrap.querySelector('.dw-add').addEventListener('click', () => {
      if (stops.length >= MAX_STOPS) return setStatus('Maximum of ' + MAX_STOPS + ' stops.', true);
      stops.push({ latlng: null, label: '' });
      renderRows();
    });

    wrap.querySelector('.dw-profile').addEventListener('change', ev => {
      profile = ev.target.value;
      if (stops.every(s => s.latlng)) route();
    });

    wrap.querySelector('.dw-go').addEventListener('click', submit);

    wrap.querySelector('.dw-clear').addEventListener('click', () => {
      stops = [{ latlng: null, label: '' }, { latlng: null, label: '' }];
      setPickMode(null);
      renderRows();
      clearRoute();
      setStatus('');
    });

    // Delegated, since the rows are rebuilt on every change.
    rowsEl.addEventListener('click', ev => {
      const pick = ev.target.closest('.dw-pick');
      if (pick) {
        const i = Number(pick.dataset.i);
        setPickMode(pickIndex === i ? null : i);
        if (pickIndex === null) setStatus('');
        return;
      }
      const del = ev.target.closest('.dw-del');
      if (del) {
        stops.splice(Number(del.dataset.i), 1);
        renderRows();
        clearRoute();
      }
    });

    // Typing invalidates a point that was already resolved for that field.
    rowsEl.addEventListener('input', ev => {
      const input = ev.target.closest('.dw-input');
      if (!input) return;
      const s = stops[Number(input.dataset.i)];
      if (s && s.label !== input.value.trim()) s.latlng = null;
    });

    rowsEl.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && ev.target.closest('.dw-input')) submit();
    });

    renderRows();
    if (!hasKey()) setStatus('Add your OpenRouteService key to ORS_API_KEY to enable routing.');
    return wrap;
  };
  control.addTo(map);

})();

// EMERGENCY ROUTE LAYERS

// Sixteen precomputed closest-facility route layers: four services (hospital,
// police, EMS, urgent care) x four flood scenarios (base, low, medium, high).
// These resolve against FLOOD_SERVICES rather than SERVICES, so changing that
// one constant moves all sixteen at once. If service names differ on a new
// endpoint, edit the paths below - each can also be a full https:// URL.
const closestHospital_Base = floodLayer('WashtenawCounty_hospital_base/FeatureServer/0');
const closestHospital_Low = floodLayer('WashtenawCounty_hospital_low/FeatureServer/0');
const closestHospital_Medium = floodLayer('WashtenawCounty_hospital_medium/FeatureServer/0');
const closestHospital_High = floodLayer('WashtenawCounty_hospital_high/FeatureServer/0');

const closestPolDept_Base = floodLayer('WashtenawCounty_polDept_base/FeatureServer/0');
const closestPolDept_Low = floodLayer('WashtenawCounty_polDept_low/FeatureServer/0');
const closestPolDept_Medium = floodLayer('WashtenawCounty_polDept_medium/FeatureServer/0');
const closestPolDept_High = floodLayer('WashtenawCounty_polDept_high/FeatureServer/0');

const closestEMS_Base = floodLayer('WashtenawCounty_ems_base/FeatureServer/0');
const closestEMS_Low = floodLayer('WashtenawCounty_ems_low/FeatureServer/0');
const closestEMS_Medium = floodLayer('WashtenawCounty_ems_medium/FeatureServer/0');
const closestEMS_High = floodLayer('WashtenawCounty_ems_high/FeatureServer/0');

// Routes to the nearest urgent care clinic
const closestUrgentCare_Base = floodLayer('WashtenawCounty_urgentCare_base/FeatureServer/0');
const closestUrgentCare_Low = floodLayer('WashtenawCounty_urgentCare_low/FeatureServer/0');
const closestUrgentCare_Medium = floodLayer('WashtenawCounty_urgentCare_medium/FeatureServer/0');
const closestUrgentCare_High = floodLayer('WashtenawCounty_urgentCare_high/FeatureServer/0');

// ============================================================================
// FLOOD RISK EMERGENCY ROUTES
// ============================================================================
// Hit "Pick a school", click any school (point or footprint), and this finds
// that school's precomputed route to its nearest HOSPITAL, EMS station, POLICE
// department and URGENT CARE clinic, then draws all four at once. One slider
// steps through the flood scenarios, redrawing all four services together:
//
//   Normal  -> no flooding, everyday road network             (..._base)
//   High    -> high-risk areas flooded                        (..._high)
//   Medium  -> high AND medium risk areas flooded             (..._medium)
//   Low     -> low, medium and high risk flooded, worst case  (..._low)
//
// So the slider runs left to right from normal conditions to the most severe
// scenario. Individual services can be switched off with the checkboxes.
//
// Routes are matched to a school BY NAME, not by proximity. Each route layer
// carries a Name field written by Network Analyst as "<incident> - <facility>",
// so the name begins with the school the route starts from. That field is
// queried for the clicked school and only genuinely matching routes are used,
// which matters in the flooded scenarios: when every road in and out of a school
// is under water the solver produces no route at all, and an unmatched service
// draws nothing and is reported as unreachable instead of latching onto a
// neighbouring school's route that happens to pass nearby.
//
// This block only uses `map`, the sixteen route layers, and helpers already
// defined above (pick, esc, formatSchoolName, queryFootprintAt,
// querySchoolPointAt, POINTS_MIN_ZOOM, FOOTPRINT_ZOOM).
// ============================================================================
(function initFloodRiskEmergencyRouter() {

  // Ordered least to most severe - this is also the slider order.
  const LEVELS = [
    { key: 'base',   tick: 'Normal', scenario: 'Normal conditions - no roads flooded.' },
    { key: 'high',   tick: 'High',   scenario: 'High-risk areas flooded.' },
    { key: 'medium', tick: 'Medium', scenario: 'High and medium risk areas flooded.' },
    { key: 'low',    tick: 'Low',    scenario: 'Low, medium and high risk areas flooded - worst case.' }
  ];

  const SERVICE_DEFS = [
    { key: 'hosp', label: 'Hospital', color: '#c1272d', weight: 6, dash: null,
      layers: { base: closestHospital_Base, high: closestHospital_High,
                medium: closestHospital_Medium, low: closestHospital_Low } },
    { key: 'ems',  label: 'EMS', color: '#d68910', weight: 5, dash: '12 8',
      layers: { base: closestEMS_Base, high: closestEMS_High,
                medium: closestEMS_Medium, low: closestEMS_Low } },
    { key: 'pol',  label: 'Police', color: '#1b3a6b', weight: 4, dash: '2 8',
      layers: { base: closestPolDept_Base, high: closestPolDept_High,
                medium: closestPolDept_Medium, low: closestPolDept_Low } },
    // Teal matches URGENT_CARE_COLOR on the clinic markers, and the dash-dot keeps
    // it readable where it runs alongside the EMS and Police lines.
    { key: 'uc',   label: 'Urgent Care', color: '#0b7285', weight: 4, dash: '10 5 2 5',
      layers: { base: closestUrgentCare_Base, high: closestUrgentCare_High,
                medium: closestUrgentCare_Medium, low: closestUrgentCare_Low } }
  ];

  // Field names Network Analyst / ArcGIS commonly uses for the route name
  const NAME_FIELDS = ['Name', 'RouteName', 'Route_Name', 'ROUTENAME', 'IncidentName'];

  // Styles for the flood panel
  const css = `
  .fr { background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.2); border-radius: 4px;
        padding: 9px 11px; font: 12px/1.4 "Avenir Next","Segoe UI",sans-serif; color: #222;
        box-shadow: 0 1px 5px rgba(0,0,0,.3); width: 236px; }
  .fr .fr-head { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                 color: #00619b; font-weight: 700; margin-bottom: 7px; }
  .fr .fr-pick { width: 100%; border: 1px solid #00619b; background: #00619b; color: #fff;
                 border-radius: 3px; padding: 6px 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .fr .fr-pick:hover { background: #00507f; }
  .fr .fr-pick.active { background: #fff; color: #00619b; }
  .fr .fr-school { margin: 8px 0 2px; font-weight: 600; color: #00619b; }
  .fr .fr-body { margin-top: 8px; }
  .fr .fr-body.hidden { display: none; }
  .fr .fr-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #888; }
  .fr input[type=range] { width: 100%; margin: 2px 0 4px; cursor: pointer; }
  .fr .fr-ticks { display: flex; justify-content: space-between; font-size: 10px; color: #888; }
  .fr .fr-ticks span { flex: 1 1 0; text-align: center; }
  .fr .fr-ticks span.on { color: #00619b; font-weight: 700; }
  .fr .fr-scenario { margin-top: 6px; padding: 5px 6px; background: #f3f7fa; border-radius: 3px;
                     font-size: 11px; color: #00619b; }
  .fr .fr-svc { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; }
  .fr .fr-svc input { margin: 0; flex: 0 0 auto; cursor: pointer; }
  .fr .fr-svc .fr-line { flex: 0 0 16px; height: 0; }
  .fr .fr-svc .fr-text { flex: 1 1 auto; min-width: 0; }
  .fr .fr-svc .fr-name { font-weight: 600; }
  .fr .fr-svc .fr-sum { color: #888; }
  .fr .fr-svc.fr-missing .fr-sum { color: #c1272d; }
  .fr .fr-svc.fr-ghosted .fr-sum { color: #8a6100; }
  .fr .fr-opt { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px;
                padding-top: 7px; border-top: 1px solid #e6e6e6; font-size: 11px; cursor: pointer; }
  .fr .fr-opt input { margin: 1px 0 0; flex: 0 0 auto; cursor: pointer; }
  .fr .fr-opt .fr-opt-text { flex: 1 1 auto; min-width: 0; }
  .fr .fr-opt .fr-opt-note { display: block; color: #888; font-size: 10px; line-height: 1.35; }
  .fr .fr-status { margin-top: 6px; color: #888; font-style: italic; font-size: 11px; }
  .fr .fr-status.err { color: #c1272d; font-style: normal; }
  .fr .fr-clear { margin-top: 6px; border: 0; background: none; color: #00619b; cursor: pointer;
                  font: inherit; padding: 0; }
  .fr .fr-clear:hover { text-decoration: underline; }
  .fr-picking { cursor: crosshair !important; }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // Geometry helpers
  function endpoints(geom) {
    if (!geom) return [];
    const g = geom;
    if (g.type === 'Point') return [g.coordinates];
    if (g.type === 'LineString') {
      const c = g.coordinates;
      return c.length ? [c[0], c[c.length - 1]] : [];
    }
    if (g.type === 'MultiLineString') {
      const out = [];
      g.coordinates.forEach(l => { if (l.length) { out.push(l[0]); out.push(l[l.length - 1]); } });
      return out;
    }
    const out = [];   // fallback: every vertex
    const walk = a => Array.isArray(a) && typeof a[0] === 'number'
      ? out.push(a) : (Array.isArray(a) && a.forEach(walk));
    walk(g.coordinates);
    return out;
  }
  const minEndpointDist = (geom, latlng) => endpoints(geom).reduce(
    (best, [lng, lat]) => Math.min(best, latlng.distanceTo(L.latLng(lat, lng))), Infinity);

  // The two real ends of a route. A multipart route's interior joins show up
  // twice in endpoints() (end of part N is the start of part N+1) while the
  // actual termini show up once, so using only those stops a passing-by route
  // from scoring a short distance off one of its mid-route junctions.
  function termini(geom) {
    const eps = endpoints(geom);
    if (eps.length <= 2) return eps;
    const key = c => c[0].toFixed(6) + ',' + c[1].toFixed(6);
    const seen = new Map();
    eps.forEach(c => seen.set(key(c), (seen.get(key(c)) || 0) + 1));
    const once = eps.filter(c => seen.get(key(c)) === 1);
    return once.length ? once : eps;
  }
  const startDist = (geom, latlng) => termini(geom).reduce(
    (best, [lng, lat]) => Math.min(best, latlng.distanceTo(L.latLng(lat, lng))), Infinity);

  // Two campuses can share one name, so distance decides between same-named
  // routes. Anything starting further than MAX_START_M from the clicked school
  // belongs to the other campus, and routes whose starts are within SAME_START_M
  // of each other count as tied on distance, in which case the name score breaks
  // the tie.
  const MAX_START_M  = 1000;   // tune if a rural school legitimately snaps further
  const SAME_START_M = 60;

  // Works out which campus was clicked. For a school with two points, the nearest
  // same-named school point to the click is the one the user meant, and everything
  // downstream measures from there. Falls back to the click itself if the point
  // layer can't be read.
  const schoolAnchor = (latlng, schoolRaw) => new Promise(resolve => {
    const want = normName(schoolRaw);
    let settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v || latlng); } };
    setTimeout(() => done(null), 6000);
    try {
      schools.query().nearby(latlng, 1600).returnGeometry(true).run((err, fc) => {
        if (err || !fc || !fc.features || !fc.features.length) return done(null);
        let best = null, bestD = Infinity;
        for (const f of fc.features) {
          if (!f.geometry || f.geometry.type !== 'Point') continue;
          if (want && normName(pick(f.properties, 'NAME', 'Name')) !== want) continue;
          const [lng, lat] = f.geometry.coordinates;
          const d = latlng.distanceTo(L.latLng(lat, lng));
          if (d < bestD) { bestD = d; best = L.latLng(lat, lng); }
        }
        done(best);
      });
    } catch (e) { done(null); }
  });

  // Name matching. Which field on a given route layer holds the route name is
  // read once per service from its metadata and cached, so no field name is
  // hard-coded.
  const nameFieldCache = new Map();
  function nameFieldOf(lyr) {
    if (!lyr) return Promise.resolve(null);
    const url = (lyr.options && lyr.options.url) || String(Math.random());
    if (!nameFieldCache.has(url)) {
      nameFieldCache.set(url, new Promise(resolve => {
        let settled = false;
        const done = v => { if (!settled) { settled = true; resolve(v); } };
        setTimeout(() => done(null), 10000);           // never hang the UI
        try {
          lyr.metadata((err, meta) => {
            const fields = (!err && meta && Array.isArray(meta.fields)) ? meta.fields : null;
            if (!fields) return done(null);
            const names = fields.filter(f => !f.type || /String/i.test(f.type)).map(f => f.name);
            const all   = fields.map(f => f.name);
            const ci = want => names.find(n => n.toLowerCase() === want.toLowerCase());
            done(NAME_FIELDS.map(ci).find(Boolean)
              || names.find(n => /name$/i.test(n))
              || names.find(n => /name/i.test(n))
              || all.find(n => /name/i.test(n))
              || null);
          });
        } catch (e) { done(null); }
      }));
    }
    return nameFieldCache.get(url);
  }

  // Normalise for comparison: upper case, & -> AND, punctuation -> single space.
  const normName = s => String(s == null ? '' : s)
    .toUpperCase().replace(/&/g, ' AND ').replace(/[^A-Z0-9]+/g, ' ').trim();
  // Looser form that ignores the school-type words, so "PIONEER HS" still matches
  // "PIONEER HIGH SCHOOL".
  const looseName = s => normName(s)
    .replace(/\b(SCHOOL|SCHOOLS|SCH|ELEMENTARY|EL|HIGH|HS|SHS|JSHS|MIDDLE|MS|JR|JUNIOR|SENIOR|ACADEMY|CENTER|CENTRE|CTR|THE)\b/g, ' ')
    .replace(/\s+/g, ' ').trim();

  // How well a route's name identifies the clicked school. 0 = not this school.
  function nameScore(routeName, school) {
    const r = normName(routeName), s = normName(school);
    if (!r || !s) return 0;
    const holds = (hay, needle) => hay === needle
      || hay.startsWith(needle + ' ') || hay.endsWith(' ' + needle)
      || hay.includes(' ' + needle + ' ');
    if (r === s) return 4;
    if (r.startsWith(s + ' ')) return 3;      // "PIONEER HS - Michigan Medicine"
    if (holds(r, s)) return 2;
    const rl = looseName(routeName), sl = looseName(school);
    if (rl && sl && holds(rl, sl)) return 1;
    return 0;
  }

  const sqlLit = s => String(s).replace(/'/g, "''");
  // null = query failed, [] = query ran and matched nothing (so no route).
  const runQuery = (lyr, where) => new Promise(resolve => {
    lyr.query().where(where).returnGeometry(true)
      .run((err, fc) => resolve(!err && fc && fc.features ? fc.features : null));
  });

  // The route in `lyr` belonging to the clicked school. Candidates have to match
  // the school by NAME, and among those the one starting closest to the clicked
  // campus wins. Returns null when this school has no route in this layer, which
  // is exactly what "every road out is flooded" looks like in the data.
  async function findRoute(lyr, schoolRaw, latlng) {
    if (!lyr || !schoolRaw) return null;
    const nf = await nameFieldOf(lyr);
    if (!nf) return null;                       // no name field -> match nothing

    const s = String(schoolRaw).trim();
    let feats = await runQuery(lyr, `UPPER(${nf}) LIKE '%${sqlLit(s.toUpperCase())}%'`);
    if (feats === null)                         // service rejected UPPER()
      feats = await runQuery(lyr, `${nf} LIKE '%${sqlLit(s)}%'`);
    if (!feats || !feats.length) {
      // Second pass on the most distinctive word, then verified client-side, which
      // covers punctuation and abbreviation differences ("ST. JOSEPH" vs "ST JOSEPH").
      const tok = normName(s).split(' ').filter(t => t.length > 3)
        .sort((a, b) => b.length - a.length)[0];
      if (tok) feats = await runQuery(lyr, `UPPER(${nf}) LIKE '%${sqlLit(tok)}%'`) || [];
    }
    if (!feats || !feats.length) return null;

    // Keep only routes whose name identifies this school, measuring how far each
    // one starts from the campus that was actually clicked.
    const cands = [];
    for (const f of feats) {
      if (!f || !f.geometry) continue;
      const score = nameScore(f.properties ? f.properties[nf] : null, s);
      if (!score) continue;                     // wrong school - never drawn
      cands.push({ f, score, d: latlng ? startDist(f.geometry, latlng) : 0 });
    }
    if (!cands.length) return null;

    // Distance first: the nearest start wins, and names only break ties between
    // routes starting from effectively the same place. This is what separates two
    // same-named campuses.
    cands.sort((a, b) => (a.d - b.d) || (b.score - a.score));
    const near = cands.filter(c => c.d <= cands[0].d + SAME_START_M);
    near.sort((a, b) => (b.score - a.score) || (a.d - b.d));
    const best = near[0];

    if (best.d > MAX_START_M) {
      // Same name, but it starts at the other campus - this school has no route of
      // its own here, so draw nothing rather than the wrong one.
      console.warn('[Flood Risk Routes] Nearest name match for "' + s + '" starts ' +
        Math.round(best.d) + ' m from the clicked point (limit ' + MAX_START_M +
        ' m) - treated as no route.');
      return null;
    }
    return best.f;
  }

  // Only used to explain a total miss in the console: field or name mismatch
  // versus a genuinely unreachable school.
  async function sampleNames(lyr) {
    const nf = await nameFieldOf(lyr);
    if (!nf) return { field: null, names: [] };
    const feats = await new Promise(resolve => {
      lyr.query().where('1=1').returnGeometry(false).limit(5)
        .run((err, fc) => resolve(!err && fc && fc.features ? fc.features : []));
    });
    return { field: nf, names: feats.map(f => f.properties && f.properties[nf]) };
  }

  // Distance and time readout, when the routes carry the usual closest-facility fields
  function routeSummary(props) {
    const miles = pick(props, 'Total_Miles', 'Miles', 'Total_Length');
    const mins  = pick(props, 'Total_Minutes', 'Total_TravelTime', 'Total_Time', 'Minutes');
    const bits = [];
    if (miles != null && !isNaN(+miles)) bits.push((+miles).toFixed(2) + ' mi');
    if (mins  != null && !isNaN(+mins))  bits.push(Math.round(+mins) + ' min');
    return bits.join(' \u00b7 ');
  }

  // State. found[serviceKey][levelKey] = { feature, gj } | null
  let armed = false, index = 0, found = {}, schoolName = '';
  // Built from SERVICE_DEFS, so adding a service needs no edit here. Every key
  // starts visible.
  const shown = Object.fromEntries(SERVICE_DEFS.map(s => [s.key, true]));
  // Emergency vehicles can push through some standing water, so the normal-
  // conditions route stays on the map as a faded ghost underneath the flooded
  // scenarios. It shows the everyday path crews would still try first, and it is
  // the only thing drawn for a service the flood solver calls unreachable.
  let showNormal = true;
  let pickBtn, bodyEl, schoolEl, ticksEl, scenarioEl, svcEl, statusEl, rangeEl, normalEl;

  const GHOST_OPACITY = .38;
  const ghostStyle = s => ({
    color: s.color, weight: Math.max(2, s.weight - 2), opacity: GHOST_OPACITY,
    lineCap: 'round', dashArray: '1 7'
  });

  const lineSwatch = s => `<i class="fr-line" style="border-top:${Math.min(s.weight, 4)}px ${
    s.dash ? 'dashed' : 'solid'} ${s.color}"></i>`;

  function eachRoute(fn) {
    SERVICE_DEFS.forEach(s => LEVELS.forEach(l => {
      const r = found[s.key] && found[s.key][l.key];
      if (r) fn(r, s, l);
    }));
  }

  function drawSelected() {
    const level = LEVELS[index];
    eachRoute((r, s, l) => {
      const on = l.key === level.key && shown[s.key];
      if (on && !map.hasLayer(r.gj)) r.gj.addTo(map);
      else if (!on && map.hasLayer(r.gj)) map.removeLayer(r.gj);

      // Ghost of the Normal route, carried into every flooded tier.
      if (r.ghost) {
        const g = showNormal && shown[s.key] && level.key !== 'base';
        if (g && !map.hasLayer(r.ghost)) r.ghost.addTo(map);
        else if (!g && map.hasLayer(r.ghost)) map.removeLayer(r.ghost);
      }
    });
    // Keep the scenario route on top of the ghost it is being compared against.
    eachRoute((r, s, l) => {
      if (l.key === level.key && map.hasLayer(r.gj)) r.gj.bringToFront();
    });
    if (rangeEl) rangeEl.value = index;
    if (ticksEl) ticksEl.forEach((t, i) => t.classList.toggle('on', i === index));
    if (scenarioEl) scenarioEl.textContent = level.scenario;
    renderServices();
  }

  function renderServices() {
    if (!svcEl) return;
    const level = LEVELS[index];
    svcEl.innerHTML = SERVICE_DEFS.map(s => {
      const r = found[s.key] && found[s.key][level.key];
      const base = found[s.key] && found[s.key].base;
      // The ghost only matters in a flooded tier, and only if a Normal route
      // exists to fall back on.
      const ghosting = showNormal && level.key !== 'base' && !!base;
      // No matching route means the flood solver found no clear way through. The
      // normal route is still drawn faded, since crews may be able to run it.
      let sum, cls = '';
      if (r) {
        sum = routeSummary(r.feature.properties) || 'route found';
      } else if (level.key === 'base') {
        sum = 'no route in the data';
        cls = ' fr-missing';
      } else if (ghosting) {
        const bsum = routeSummary(base.feature.properties);
        sum = 'no clear route, normal route shown' + (bsum ? ' (' + bsum + ')' : '');
        cls = ' fr-ghosted';
      } else {
        sum = 'unreachable, roads flooded';
        cls = ' fr-missing';
      }
      // Stay enabled whenever there is anything to toggle - the scenario route or
      // the ghost.
      const toggleable = !!r || ghosting;
      return `<label class="fr-svc${cls}">
          <input type="checkbox" data-svc="${s.key}"${shown[s.key] ? ' checked' : ''}${toggleable ? '' : ' disabled'} />
          ${lineSwatch(s)}
          <span class="fr-text"><span class="fr-name">${esc(s.label)}</span>
            <span class="fr-sum"> ${esc(sum)}</span></span>
        </label>`;
    }).join('');
  }

  function clearRoutes() {
    eachRoute(r => {
      if (map.hasLayer(r.gj)) map.removeLayer(r.gj);
      if (r.ghost && map.hasLayer(r.ghost)) map.removeLayer(r.ghost);
    });
    found = {};
  }

  async function pickSchool(latlng) {
    setArmed(false);
    setStatus('Finding routes\u2026');

    // Confirm the click landed on a school (mirrors the main click handler).
    const z = map.getZoom();
    let props = null;
    if (z >= POINTS_MIN_ZOOM) {
      props = z >= FOOTPRINT_ZOOM
        ? (await queryFootprintAt(latlng)) || (await querySchoolPointAt(latlng))
        : await querySchoolPointAt(latlng);
    }
    if (!props) {
      clearRoutes();
      if (bodyEl) bodyEl.classList.add('hidden');
      return setStatus('No school there, click directly on a school point or building.', true);
    }
    const schoolRaw = pick(props, 'NAME', 'Name');
    schoolName = formatSchoolName(schoolRaw) || 'Selected school';
    if (schoolEl) schoolEl.textContent = schoolName;

    // Measure route starts from the school POINT of the campus that was clicked
    // rather than from the raw click - a click on the far edge of a footprint
    // would otherwise skew the distance test.
    const anchor = await schoolAnchor(latlng, schoolRaw);

    // Look up this school's route in all sixteen layers at once, by name.
    clearRoutes();
    const jobs = [];
    SERVICE_DEFS.forEach(s => LEVELS.forEach(l => {
      jobs.push(findRoute(s.layers[l.key], schoolRaw, anchor)
        .catch(() => null)
        .then(f => ({ s, l, f })));
    }));
    const results = await Promise.all(jobs);

    found = {};
    results.forEach(({ s, l, f }) => {
      found[s.key] = found[s.key] || {};
      if (!f || !f.geometry) { found[s.key][l.key] = null; return; }
      const sum = routeSummary(f.properties);
      const rname = pick(f.properties, 'Name', 'RouteName', 'Route_Name', 'IncidentName');
      const gj = L.geoJSON(f, {
        style: { color: s.color, weight: s.weight, opacity: .95, lineCap: 'round',
                 dashArray: s.dash || null }
      }).bindPopup(`<div class="school-popup"><h3>${esc(s.label)} route ${esc(l.tick)}</h3>` +
        `<div class="sp-block">${esc(schoolName)} \u2192 nearest ${esc(s.label.toLowerCase())}` +
        (sum ? `<br>${esc(sum)}` : '') +
        (rname ? `<br><span style="color:#888">${esc(rname)}</span>` : '') +
        `<br>${esc(l.scenario)}</div></div>`);

      // The Normal route gets a second, faded copy that rides along into the
      // flooded scenarios as a reference path for emergency vehicles.
      let ghost = null;
      if (l.key === 'base') {
        ghost = L.geoJSON(f, { style: ghostStyle(s) })
          .bindPopup(`<div class="school-popup"><h3>${esc(s.label)} route Normal</h3>` +
            `<div class="sp-block">${esc(schoolName)} \u2192 nearest ${esc(s.label.toLowerCase())}` +
            (sum ? `<br>${esc(sum)}` : '') +
            (rname ? `<br><span style="color:#888">${esc(rname)}</span>` : '') +
            `<br>Everyday route, shown for reference. Emergency vehicles may still ` +
            `be able to run it through shallow flooding.</div></div>`);
      }
      found[s.key][l.key] = { feature: f, gj, ghost };
    });

    const any = results.some(r => r.f && r.f.geometry);
    if (!any) {
      if (bodyEl) bodyEl.classList.add('hidden');
      // Nothing matched in ANY of the sixteen layers, including Normal conditions.
      // That is usually a name mismatch rather than flooding, so log what the layer
      // actually stores to make it easy to check.
      sampleNames(SERVICE_DEFS[0].layers.base).then(({ field, names }) => {
        console.warn('[Flood Risk Routes] No route named for "' + schoolRaw + '". ' +
          (field ? 'Route name field: "' + field + '", e.g. ' + JSON.stringify(names)
                 : 'No name field found on the route layer.'));
      }).catch(() => {});
      return setStatus('No routes are named for this school in any scenario.', true);
    }

    setStatus('');
    if (bodyEl) bodyEl.classList.remove('hidden');
    drawSelected();
    fitToVisible();
  }

  function fitToVisible() {
    const level = LEVELS[index];
    let b = null;
    const add = lyr => {
      if (!lyr) return;
      const rb = lyr.getBounds();
      if (!rb.isValid()) return;
      b = b ? b.extend(rb) : L.latLngBounds(rb.getSouthWest(), rb.getNorthEast());
    };
    SERVICE_DEFS.forEach(s => {
      if (!shown[s.key]) return;
      const r = found[s.key] && found[s.key][level.key];
      if (r) add(r.gj);
      // Include the ghost so the everyday route is never left off-screen.
      const base = found[s.key] && found[s.key].base;
      if (showNormal && level.key !== 'base' && base) add(base.ghost || base.gj);
    });
    if (b && b.isValid()) map.fitBounds(b, { padding: [40, 40] });
  }

  function reset() {
    clearRoutes();
    schoolName = ''; index = 0;
    SERVICE_DEFS.forEach(s => { shown[s.key] = true; });
    showNormal = true;
    if (normalEl) normalEl.checked = true;
    setArmed(false);
    if (schoolEl) schoolEl.textContent = '';
    if (bodyEl) bodyEl.classList.add('hidden');
    if (rangeEl) rangeEl.value = 0;
    setStatus('');
  }

  function setArmed(on) {
    armed = on;
    const c = map.getContainer();
    if (on) L.DomUtil.addClass(c, 'fr-picking'); else L.DomUtil.removeClass(c, 'fr-picking');
    if (pickBtn) {
      pickBtn.classList.toggle('active', on);
      pickBtn.textContent = on ? 'Click a school on the map\u2026' : 'Pick a school';
    }
    if (on) setStatus('');
  }

  function setStatus(msg, err) {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('err', !!err);
  }

  // Claim the click before the main handler opens a popup, the same way the
  // directions widget does. Directions still gets first refusal.
  const prevClaim = window.__dwPickClick;
  window.__dwPickClick = latlng => {
    if (typeof prevClaim === 'function' && prevClaim(latlng)) return true;
    if (!armed) return false;
    pickSchool(latlng);
    return true;
  };

  // The control itself
  const ctrl = L.control({ position: 'bottomleft' });
  ctrl.onAdd = function () {
    const div = L.DomUtil.create('div', 'fr');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    div.innerHTML = `
      <div class="fr-head">Flood Risk Routes</div>
      <button type="button" class="fr-pick">Pick a school</button>
      <div class="fr-school"></div>
      <div class="fr-body hidden">
        <div class="fr-label">Flood scenario</div>
        <input type="range" class="fr-range" min="0" max="${LEVELS.length - 1}" step="1" value="0"
               aria-label="Flood scenario" />
        <div class="fr-ticks">${LEVELS.map(l => `<span>${l.tick}</span>`).join('')}</div>
        <div class="fr-scenario"></div>
        <div class="fr-services"></div>
        <label class="fr-opt">
          <input type="checkbox" class="fr-normal" checked />
          <span class="fr-opt-text">Keep normal route visible
            <span class="fr-opt-note">Faded dotted line in the flooded scenarios, emergency
              vehicles can often still drive through shallow water.</span></span>
        </label>
      </div>
      <div class="fr-status"></div>
      <button type="button" class="fr-clear">Clear</button>`;
    pickBtn    = div.querySelector('.fr-pick');
    schoolEl   = div.querySelector('.fr-school');
    bodyEl     = div.querySelector('.fr-body');
    ticksEl    = div.querySelectorAll('.fr-ticks span');
    scenarioEl = div.querySelector('.fr-scenario');
    svcEl      = div.querySelector('.fr-services');
    statusEl   = div.querySelector('.fr-status');
    rangeEl    = div.querySelector('.fr-range');
    normalEl   = div.querySelector('.fr-normal');

    pickBtn.addEventListener('click', () => setArmed(!armed));
    rangeEl.addEventListener('input', e => { index = Number(e.target.value); drawSelected(); });
    svcEl.addEventListener('change', e => {
      const box = e.target.closest('input[data-svc]');
      if (!box) return;
      shown[box.dataset.svc] = box.checked;
      drawSelected();
    });
    normalEl.addEventListener('change', e => { showNormal = e.target.checked; drawSelected(); });
    div.querySelector('.fr-clear').addEventListener('click', reset);
    return div;
  };
  ctrl.addTo(map);

})();

</script>
