<style>
  html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;          /* the page itself never scrolls */
  overscroll-behavior: none; /* kills rubber-band / pull-to-refresh on touch */
}
#WashtenawMap {
  position: fixed;
  inset: 0;                  /* top/right/bottom/left: 0 */
}
  .isd-label {
    background: rgba(255,255,255,.8); border: 1px solid rgba(0,0,0,.25); border-radius: 3px;
    padding: 2px 5px; font-size: 10px; font-weight: bold; color: #111;
    white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .isd-label::before { display: none; }

  /* Facility markers: round pin = hospital, badge = law enforcement */
  .hosp-icon, .le-icon { background: none; border: none; }
  .hosp-pin, .le-badge {
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .hosp-pin { width: 18px; height: 18px; border-radius: 50%; background: var(--c, #0f8a8a); }
  .le-badge { width: 18px; height: 20px; border-radius: 3px 3px 7px 7px; background: var(--c, #1b3a6b); }
  .hosp-pin:hover, .le-badge:hover { transform: scale(1.15); }

  /* Popup card */
  .school-popup { font: 13px/1.45 "Avenir Next", "Segoe UI", sans-serif; color: #323232; }
  .school-popup h3 { margin: 0 0 8px; font-size: 15px; color: #00619b; }
  .school-popup h4 { margin: 10px 0 4px; font-size: 13px; border-bottom: 2px solid #e0e0e0; padding-bottom: 3px; }
  .school-popup a { color: #00619b; }
  .school-popup .sp-block { margin: 6px 0; white-space: pre-line; }
  .school-popup .sp-loading { color: #888; font-style: italic; }
  .school-popup table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  .school-popup td { padding: 4px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  .school-popup td:first-child { background: #f3f3f3; font-weight: 600; width: 38%; }

  /* Search widget */
  .map-search {
    background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.2); border-radius: 4px;
    padding: 6px; font: 12px/1.4 "Avenir Next","Segoe UI",sans-serif; color: #222;
    box-shadow: 0 1px 5px rgba(0,0,0,.3); width: min(270px, calc(100vw - 20px)); box-sizing: border-box;
  }
  .map-search .ms-box { display: flex; align-items: center; gap: 6px; }
  .map-search input.ms-input {
    flex: 1 1 auto; min-width: 0; border: 1px solid rgba(0,0,0,.25); border-radius: 3px;
    padding: 6px 8px; font: inherit; color: #222; outline: none; background: #fff;
  }
  .map-search input.ms-input:focus { border-color: #00619b; }
  .map-search .ms-clear {
    border: none; background: none; cursor: pointer; color: #888; font-size: 17px;
    line-height: 1; padding: 2px 5px; flex: 0 0 auto;
  }
  .map-search .ms-clear:hover { color: #333; }
  .map-search .ms-results {
    display: none; margin-top: 6px; max-height: 55vh; overflow-y: auto; overscroll-behavior: contain;
    border-top: 1px solid #e0e0e0; padding-top: 4px;
  }
  .map-search .ms-results.open { display: block; }
  .map-search h6 { margin: 6px 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #00619b; }
  .map-search h6:first-child { margin-top: 0; }
  .map-search .ms-row {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; background: none;
    border: 0; font: inherit; color: #222; cursor: pointer; padding: 4px 3px; border-radius: 3px;
  }
  .map-search .ms-row:hover { background: rgba(0,97,155,.08); }
  .map-search .ms-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .map-search .ms-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-search .ms-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; color: #888; }
  .map-search .ms-empty { color: #888; font-style: italic; padding: 4px 3px; }

  /* Directions widget */
  .dw-launch {
    background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.2); border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,.3); font: 12px/1.4 "Avenir Next","Segoe UI",sans-serif;
    color: #00619b; font-weight: 600; cursor: pointer; padding: 7px 10px;
  }
  .dw-launch:hover { background: #fff; }

  .map-directions {
    background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.2); border-radius: 4px;
    padding: 8px; font: 12px/1.4 "Avenir Next","Segoe UI",sans-serif; color: #222;
    box-shadow: 0 1px 5px rgba(0,0,0,.3); width: min(280px, calc(100vw - 20px)); box-sizing: border-box;
    max-height: 78vh; overflow-y: auto; overscroll-behavior: contain;
  }
  .map-directions .dw-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .map-directions .dw-title {
    flex: 1 1 auto; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: #00619b; font-weight: 700;
  }
  .map-directions .dw-x { border: 0; background: none; cursor: pointer; color: #888; font-size: 17px; line-height: 1; padding: 0 3px; }
  .map-directions .dw-x:hover { color: #333; }

  .map-directions .dw-row { display: flex; align-items: center; gap: 5px; margin: 4px 0; }
  .map-directions .dw-letter {
    flex: 0 0 18px; height: 18px; border-radius: 50%; background: #00619b; color: #fff;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .map-directions input.dw-input {
    flex: 1 1 auto; min-width: 0; border: 1px solid rgba(0,0,0,.25); border-radius: 3px;
    padding: 5px 7px; font: inherit; color: #222; background: #fff; outline: none;
  }
  .map-directions input.dw-input:focus { border-color: #00619b; }
  .map-directions .dw-mini {
    flex: 0 0 auto; border: 1px solid rgba(0,0,0,.18); background: #fff; border-radius: 3px;
    cursor: pointer; font-size: 12px; line-height: 1; padding: 4px 5px; color: #555;
  }
  .map-directions .dw-mini:hover { background: #eef4f8; color: #00619b; }
  .map-directions .dw-mini.active { background: #00619b; border-color: #00619b; color: #fff; }

  .map-directions .dw-controls { display: flex; align-items: center; gap: 5px; margin-top: 7px; }
  .map-directions select.dw-profile {
    flex: 1 1 auto; min-width: 0; border: 1px solid rgba(0,0,0,.25); border-radius: 3px;
    padding: 5px; font: inherit; background: #fff; color: #222;
  }
  .map-directions .dw-btn {
    border: 1px solid #00619b; background: #00619b; color: #fff; border-radius: 3px;
    padding: 5px 10px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .map-directions .dw-btn:hover { background: #00507f; }
  .map-directions .dw-btn.dw-ghost { background: #fff; color: #666; border-color: rgba(0,0,0,.2); }
  .map-directions .dw-btn.dw-ghost:hover { color: #333; }
  .map-directions .dw-add { border: 0; background: none; color: #00619b; cursor: pointer; font: inherit; padding: 2px 0 2px 23px; }
  .map-directions .dw-add:hover { text-decoration: underline; }

  .map-directions .dw-status { margin-top: 7px; color: #888; font-style: italic; }
  .map-directions .dw-status.dw-err { color: #c1272d; font-style: normal; }
  .map-directions .dw-summary {
    margin-top: 7px; padding: 6px 7px; background: #f3f7fa; border-radius: 3px;
    font-weight: 600; color: #00619b;
  }
  .map-directions .dw-summary span { display: block; font-weight: 400; font-size: 10.5px; color: #888; }
  .map-directions ol.dw-steps {
    margin: 6px 0 0; padding: 0 0 0 20px; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain;
  }
  .map-directions ol.dw-steps li { padding: 3px 0; border-bottom: 1px solid #eee; }
  .map-directions ol.dw-steps li:last-child { border-bottom: 0; }
  .map-directions .dw-stepdist { color: #888; font-size: 10.5px; }

  /* Waypoint markers dropped by the routing control */
  .dw-wp-icon { background: none; border: none; }
  .dw-wp {
    display: flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 50%; background: #00619b; color: #fff;
    font: 700 11px/1 "Avenir Next","Segoe UI",sans-serif; border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.45);
  }

  /* Crosshair while the user is picking a waypoint off the map */
  .dw-picking { cursor: crosshair !important; }
</style>

<div id="WashtenawMap"></div>

<script>
// ============================================================================
// WASHTENAW COUNTY SCHOOLS & PUBLIC SAFETY MAP
// ============================================================================
// Interactive map of Washtenaw County schools and the emergency services around
// them. What it draws and does:
//   - school points / building footprints, school districts, intermediate districts
//   - hospitals, urgent care, local law enforcement, fire stations
//   - a popup on any feature with its district, municipality, dispatch zones,
//     and nearest facilities
//   - a legend that lists only what is currently on screen
//   - text search across every dataset
//   - point-to-point directions through OpenRouteService
//   - precomputed emergency routes under four flood scenarios
// ============================================================================

// ============================================================================
// SETUP
// ============================================================================
// Map is centred on Washtenaw County. Zoom 10 frames the whole county; the
// fitBounds call further down replaces this once the county extent comes back.
const map = L.map('WashtenawMap', {
  preferCanvas: false, updateWhenZooming: false, updateWhenIdle: true,
  minZoom: 9   // below this the county datasets are just a speck on an empty map
}).setView([42.2529, -83.8264], 10);
L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/positron',  // or 'liberty' / 'bright'
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);


const SERVICES = 'https://services3.arcgis.com/DwYBePxTPLzTYNGn/arcgis/rest/services/';

// Base URL for the flood-scenario routing layers. Separate from SERVICES so
// those sixteen layers can be pointed at a different ArcGIS org by editing this
// one line (keep the trailing slash) without touching anything else on the map.
const FLOOD_SERVICES = 'https://services3.arcgis.com/DwYBePxTPLzTYNGn/arcgis/rest/services/';
// e.g. const FLOOD_SERVICES = 'https://services1.arcgis.com/XXXXXXXX/arcgis/rest/services/';

// Both helpers below take a service path relative to their base URL. Handing
// either one a full https:// URL uses it as-is, for a layer that lives
// somewhere neither base covers.
const buildUrl = (base, path) => /^https?:\/\//i.test(path) ? path : base + path;

const layer = (path, opts = {}) =>
  L.esri.featureLayer({ url: buildUrl(SERVICES, path), ...opts });

// Same as layer(), but builds off FLOOD_SERVICES.
const floodLayer = (path, opts = {}) =>
  L.esri.featureLayer({ url: buildUrl(FLOOD_SERVICES, path), ...opts });
 

// Field names differ in casing across these feature services, so this reads
// tolerantly: grabs the first non-empty property matching any candidate name.
const pick = (props, ...names) => {
  if (!props) return null;
  for (const n of names) {
    const key = props && Object.keys(props).find(k => k.toLowerCase() === n.toLowerCase());
    if (key != null && props[key] != null && String(props[key]).trim() !== '') return props[key];
  }
  return null;
};

const properCase = s => String(s ?? '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const MI = 1609.344;                 // metres per mile
const CLICK_TOLERANCE_PX = 10;
// Zoom thresholds for what draws when. A county's worth of features is a small
// enough payload to draw at the default whole-county view.
const POINTS_MIN_ZOOM = 9;           // don't draw point markers if zoomed out past this
const FOOTPRINT_ZOOM = 15;           // swap from points to building outlines here
const FACILITY_MIN_ZOOM = 11;        // hospitals / local law enforcement / fire stations

// ============================================================================
// SYMBOLOGY
// ============================================================================
// School colour: red = private, blue = public, grey = unknown
const getColor = p => {
  const t = (p.TYPE || p.type || '').toLowerCase().trim();
  return t === 'private' ? '#FF3333' : t === 'public' ? '#3388FF' : '#808080';
};

// Gives each district name its own colour, same colour every time it is drawn
const getRandomColor = str => {
  if (!str) return '#808080';
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${Math.abs(hash) % 360}, 65%, 65%)`;
};

// Shared divIcon factory for the facility markers
const glyphIcon = (cls, shape, color, glyph, h) => L.divIcon({
  className: cls,
  html: `<span class="${shape}" style="--c:${color}">${glyph}</span>`,
  iconSize: [18, h], iconAnchor: [9, h / 2], popupAnchor: [0, -h / 2]
});
const svg = d => `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="${d}" fill="#fff"/></svg>`;

const HOSPITAL_GLYPH = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
    <rect x="6.4" y="2" width="3.2" height="12" fill="#fff"/>
    <rect x="2" y="6.4" width="12" height="3.2" fill="#fff"/></svg>`;
const LOCAL_LE_GLYPH = svg('M8 1.5 L9.8 6 L14.5 6.3 L10.9 9.3 L12.1 13.9 L8 11.3 L3.9 13.9 L5.1 9.3 L1.5 6.3 L6.2 6 Z'); // star
const FIRE_GLYPH     = svg('M8 1.5 C10 4.5 12.5 6 12.5 9.2 C12.5 12 10.5 14.5 8 14.5 C5.5 14.5 3.5 12 3.5 9.2 C3.5 8 4 7 4.8 6.3 C4.7 7.8 5.6 8.7 6.6 8.7 C7.8 8.7 8 7.5 7.6 6.2 C7.2 4.8 7.5 3 8 1.5 Z'); // flame
// Urgent care gets a plus like the hospital, but in a square badge and a
// different colour so the two read as distinct at a glance.
const URGENT_CARE_GLYPH = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
    <rect x="6.6" y="2.4" width="2.8" height="11.2" rx="1" fill="#fff"/>
    <rect x="2.4" y="6.6" width="11.2" height="2.8" rx="1" fill="#fff"/></svg>`;
const URGENT_CARE_COLOR = '#0b7285';

// HOSPITALS ONLY. The source service (WashtenawHealthCareUnits) also carries
// clinics, nursing homes and similar units; none of them bear on school
// emergency response, so nothing but hospitals is drawn, counted, searched or
// listed anywhere on this map. Facility-type field naming is inconsistent
// across services, hence the tolerant pick().
const facType = p => String(pick(p, 'Facility_1', 'FacilityType', 'Facility_Type', 'TYPE') || '').toLowerCase();
const isHospital = p => facType(p).includes('hospital');
const HOSPITAL_COLOR = '#c1272d';

// esri-leaflet needs pointToLayer to return a layer (returning null throws), so
// excluded features get a zero-size, non-interactive stand-in instead.
const HIDDEN_ICON = L.divIcon({ className: 'fac-hidden', html: '', iconSize: [0, 0] });

// Marker factory for the point-facility layers. `extra.exclude` is a predicate
// on feature properties; matching features are drawn invisibly.
const facilityPoints = (path, icon, titleFields, fallbackTitle, extra = {}) => {
  const { exclude, ...opts } = extra;
  return layer(path, {
    precision: 6,
    pointToLayer: (gj, latlng) => {
      if (exclude && exclude(gj.properties)) {
        return L.marker(latlng, { icon: HIDDEN_ICON, interactive: false, opacity: 0, keyboard: false });
      }
      return L.marker(latlng, {
        icon: typeof icon === 'function' ? icon(gj.properties) : icon,
        riseOnHover: true,
        title: pick(gj.properties, ...titleFields) || fallbackTitle
      });
    },
    ...opts
  });
};

// ============================================================================
// LAYERS
// ============================================================================
// School points and footprints, swapped at the zoom thresholds set above
const schools = layer('WashtenawSchoolPoints/FeatureServer/0', {
  precision: 6,                                   // PERF: trim coord precision on the wire
  pointToLayer: (gj, latlng) => L.circleMarker(latlng, {
    radius: 3.5, fillColor: getColor(gj.properties), fillOpacity: 1, color: '#004561', weight: 0.5
  })
});

const footprints = layer('WashtenawSchoolFootprints/FeatureServer/0', {
  precision: 6,                                   // PERF: lighter payload, full detail kept
  style: f => ({ fillColor: getColor(f.properties), fillOpacity: 0.8, color: '#000', weight: 1 })
});

// Intermediate school districts, filled and labelled once on their largest
// landmass. Kept as a named layer because the popups query it directly - this
// is the source of truth for which ISD a location sits in.
const labelLayer = L.layerGroup().addTo(map);
const labelTracker = {};  // name -> { area, marker }

const intermediateDistricts = layer('Intermediate_School_Districts/FeatureServer/0', {
  simplifyFactor: 0.35,     // PERF: few enough polygons to keep decent detail
  precision: 5,             // PERF: ~1 m coords, plenty for these boundaries
  interactive: false,
  style: f => ({
    color: '#000', weight: 2, opacity: 1, fill: true,
    fillColor: getRandomColor(f.properties.NAME || f.properties.Label || ''), fillOpacity: 0.25
  }),
  onEachFeature: (feature, lyr) => {
    const name = feature.properties.NAME || feature.properties.Label || '';
    if (!name) return;

    // Find the largest ring and its vertex-average centroid
    let maxArea = 0, center = null;
    const scan = pts => {
      if (!pts.length) return;
      if (!(pts[0] instanceof L.LatLng)) return pts.forEach(scan);
      let area = 0, latSum = 0, lngSum = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        area += a.lng * b.lat - b.lng * a.lat;
        latSum += a.lat; lngSum += a.lng;
      }
      area = Math.abs(area) / 2;
      if (area > maxArea) {
        maxArea = area;
        center = L.latLng(latSum / pts.length, lngSum / pts.length);
      }
    };
    scan(lyr.getLatLngs());
    if (!center) return;

    // Keep only the label anchored to the biggest landmass seen for this name
    const prev = labelTracker[name];
    if (prev && maxArea <= prev.area) return;
    if (prev) labelLayer.removeLayer(prev.marker);

    const marker = L.circleMarker(center, { radius: 0, opacity: 0, fillOpacity: 0 })
      .bindTooltip(feature.properties.Label || name, {
        permanent: true, direction: 'center', className: 'isd-label'
      });
    labelLayer.addLayer(marker);
    labelTracker[name] = { area: maxArea, marker };
  }
}).addTo(map);

// School district outlines, no fill, kept on top
const schoolDistricts = layer('Washtenaw_School_Districts/FeatureServer/0', {
  simplifyFactor: 0.35,     // PERF: only a dozen districts here, so keep more detail
  precision: 5,
  interactive: false,
  style: () => ({ color: '#000', weight: 1, opacity: 0.3, fill: false })
}).addTo(map);
schoolDistricts.on('load', () => schoolDistricts.bringToFront());

// Washtenaw County outline, drawn for orientation. Name filter keeps it to the
// one polygon.
const countyOutline = layer('County/FeatureServer/0', {
  where: "UPPER(Name) LIKE '%WASHTENAW%'",
  precision: 5,
  interactive: false,
  style: () => ({ color: '#00619b', weight: 2.5, opacity: 0.85, fill: false, dashArray: '6 4' })
}).addTo(map);
countyOutline.on('load', () => countyOutline.bringToFront());

// Boundary layers used only for lookups, never added to the map
const counties            = layer('County/FeatureServer/0');   // statewide layer, so filter by name when fitting
const minorCivilDivision  = layer('Minor_Civil_Divisions/FeatureServer/0');
const villages            = layer('MI_Villages/FeatureServer/0');
const statePoliceZones    = layer('Washtenaw_State_Police_Zones/FeatureServer/0');
const emshdZones          = layer('EMSHD_Zones_Washtenaw/FeatureServer/0');
const psapBoundaries      = layer('PSAP_Boundary_Washtenaw/FeatureServer/0');

// Point facility layers, only shown once zoomed in
const localLawEnforcement = facilityPoints('LocalLawEnforcement/FeatureServer/0',
  glyphIcon('le-icon', 'le-badge', '#8a6b12', LOCAL_LE_GLYPH, 20),
  ['NAME', 'Name', 'DEPARTMENT', 'Department'], 'Local Law Enforcement');

const hospitals = facilityPoints('WashtenawHealthCareUnits/FeatureServer/0',
  glyphIcon('hosp-icon', 'hosp-pin', HOSPITAL_COLOR, HOSPITAL_GLYPH, 18),
  ['NAME', 'Name', 'FACILITY', 'Facility'], 'Hospital',
  { exclude: p => !isHospital(p) });  // every non-hospital unit is dropped

// Urgent care clinics. This service has a thin schema - Name, SourceID,
// CurbApproa, osm_id - so there is no address, phone or website to show; the
// popup falls back to an em-dash on those rows and works out County spatially
// like the other facility layers. The picks below stay tolerant so the popup
// and search fill in automatically if address or contact fields ever appear.
const urgentCare = facilityPoints('WC_nearest_urgent_care/FeatureServer/0',
  glyphIcon('le-icon', 'le-badge', URGENT_CARE_COLOR, URGENT_CARE_GLYPH, 20),
  ['Name', 'NAME', 'FACILITY', 'Facility'], 'Urgent Care');

// Fire stations. Washtenaw_FIRE is a SECURED layer - an unauthenticated request
// comes back {"code":499,"Token Required"}. It is wired into markers, popups,
// nearest-facility lookup, legend and search exactly like the other point
// facilities, but it only DRAWS once it can be read. Either share the layer
// publicly in ArcGIS Online, or paste a valid ArcGIS token into FIRE_TOKEN
// below (it gets forwarded on every request). Left blank, the fire layer stays
// silent and nothing else on the map changes.
const FIRE_COLOR = '#e8590c';
const FIRE_TOKEN = '';   // <<< paste an ArcGIS token here, or share the layer publicly
const fireStations = facilityPoints('Washtenaw_FIRE/FeatureServer/0',
  glyphIcon('le-icon', 'le-badge', FIRE_COLOR, FIRE_GLYPH, 20),
  ['NAME', 'Name', 'DEPARTMENT', 'Department', 'DEPT_NAME', 'STATION', 'Station', 'FIRE_DEPT'],
  'Fire Station',
  {
    ...(String(FIRE_TOKEN).trim() ? { token: String(FIRE_TOKEN).trim() } : {}),
    // Fallback styling: if this service turns out to hold fire response DISTRICTS
    // (polygons) instead of stations (points), esri-leaflet applies `style` to the
    // polygons while `pointToLayer` handles points, so the layer shows up either
    // way. The popup and search wiring below assumes point stations.
    style: () => ({ color: FIRE_COLOR, weight: 1.5, opacity: 0.9, fillColor: FIRE_COLOR, fillOpacity: 0.12 })
  });

// ============================================================================
// ZOOM-DRIVEN VISIBILITY
// ============================================================================
// Each facility layer switches on past its own threshold, kept separate so they
// can be tuned independently if the map gets busy.
const zoomToggled = [
  { layer: hospitals,           minZoom: FACILITY_MIN_ZOOM },
  { layer: urgentCare,          minZoom: FACILITY_MIN_ZOOM },
  { layer: localLawEnforcement, minZoom: FACILITY_MIN_ZOOM },
  { layer: fireStations,        minZoom: FACILITY_MIN_ZOOM }
];

const toggle = (lyr, on) => {
  if (on && !map.hasLayer(lyr)) map.addLayer(lyr);
  else if (!on && map.hasLayer(lyr)) map.removeLayer(lyr);
};

function updateLayers() {
  const z = map.getZoom();
  zoomToggled.forEach(e => toggle(e.layer, z >= e.minZoom));
  toggle(footprints, z >= FOOTPRINT_ZOOM);                    // zoomed way in: building outlines
  toggle(schools, z >= POINTS_MIN_ZOOM && z < FOOTPRINT_ZOOM); // medium zoom: school points
  toggle(labelLayer, z < POINTS_MIN_ZOOM);                    // zoomed way out: ISD labels only
}
map.on('zoomend', updateLayers);
updateLayers();

// Frames Washtenaw County on load. County, PSAP and EMHSD are statewide
// services, so the county boundary is fetched with an explicit name filter -
// `1=1` would return all 83 Michigan counties and frame the whole state.
const COUNTY_WHERE = "UPPER(Name) LIKE '%WASHTENAW%'";

counties.query().where(COUNTY_WHERE).bounds((err, bounds) => {
  if (!err && bounds && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [10, 10] });
    updateLayers();
    return;
  }
  // Fall back to the district extract, which is already clipped to the county.
  schoolDistricts.query().bounds((e2, b2) => {
    if (!e2 && b2 && b2.isValid()) map.fitBounds(b2, { padding: [10, 10] });
    updateLayers();
  });
});

// ============================================================================
// QUERY HELPERS
// ============================================================================
// Point in polygon: first feature of `layer` the clicked point falls inside.
const queryIntersect = (lyr, latlng) => new Promise(resolve => {
  lyr.query().intersects(latlng).returnGeometry(false)
    .run((err, fc) => resolve(!err && fc && fc.features.length ? fc.features[0].properties : null));
});

// Every feature intersecting a geometry or point, not just the first one.
const queryIntersectAll = (lyr, geom) => new Promise(resolve => {
  lyr.query().intersects(geom).returnGeometry(false)
    .run((err, fc) => resolve(!err && fc && fc.features ? fc.features.map(f => f.properties) : []));
});

// Nearest point feature within `radiusMiles`, with the distance worked out
// client-side.
const queryNearest = (lyr, latlng, radiusMiles, filterFn) => new Promise(resolve => {
  const finish = fc => {
    if (!fc || !fc.features || !fc.features.length) return resolve(null);
    let best = null, bestM = Infinity;
    for (const f of fc.features) {
      if (filterFn && !filterFn(f.properties)) continue;
      if (!f.geometry || f.geometry.type !== 'Point') continue;
      const [lng, lat] = f.geometry.coordinates;
      const d = latlng.distanceTo(L.latLng(lat, lng));
      if (d < bestM) { bestM = d; best = f; }
    }
    resolve(best ? { props: best.properties, miles: bestM / MI } : null);
  };
  lyr.query().nearby(latlng, radiusMiles * MI).run((err, fc) => {
    if (!err) return finish(fc);
    // Fallback if the service rejects a distance query: pull everything.
    lyr.query().where('1=1').run((err2, fc2) => finish(err2 ? null : fc2));
  });
});

// The school district polygon under a point, WITH geometry, so later
// intersection queries can run against it.
const queryDistrictAt = latlng => new Promise(resolve => {
  schoolDistricts.query().intersects(latlng).returnGeometry(true)
    .run((err, fc) => resolve(!err && fc && fc.features.length ? fc.features[0] : null));
});

// Footprint properties under a clicked coordinate. Clicks are caught on the MAP
// and answered with a spatial query rather than relying on esri-leaflet to
// forward per-feature DOM clicks, which makes this immune to z-order,
// bringToFront, `interactive` and canvas hit-testing.
const queryFootprintAt = latlng => queryIntersect(footprints, latlng);

// Pixel distance -> metres at the current centre and zoom, so click tolerance
// stays sane at any zoom level.
function pixelsToMeters(px) {
  const c = map.latLngToContainerPoint(map.getCenter());
  return map.getCenter().distanceTo(map.containerPointToLatLng(L.point(c.x + px, c.y)));
}

// Nearest school point within a small click-tolerance radius
const querySchoolPointAt = latlng =>
  queryNearest(schools, latlng, pixelsToMeters(CLICK_TOLERANCE_PX) / MI).then(r => r ? r.props : null);

// POPUP BUILDING BLOCKS

const row = (label, value) => `<tr><td>${esc(label)}</td><td>${esc(value || '-')}</td></tr>`;

// A URL field rendered as a link, falling back to plain text when the value is a
// placeholder like "NOT AVAILABLE" instead of a real address.
const linkRow = (label, url, text) => {
  const raw = String(url || '').trim();
  if (!raw || !/^https?:\/\//i.test(raw)) return row(label, raw);
  return `<tr><td>${esc(label)}</td><td><a href="${esc(raw)}" target="_blank" rel="noopener noreferrer">${esc(text || raw)}</a></td></tr>`;
};

const card = (title, body) => `<div class="school-popup"><h3>${esc(title)}</h3>${body}</div>`;
const table = rows => `<table>${rows.join('')}</table>`;

// Opens a loading popup right away, then hands it to an async builder
function openPopup(latlng, options, loadingText, build, errorText) {
  const popup = L.popup({ autoPanPadding: [30, 30], ...options })
    .setLatLng(latlng)
    .setContent(`<div class="school-popup sp-loading">${loadingText}\u2026</div>`)
    .openOn(map);
  Promise.resolve(build(popup)).catch(() => {
    if (popup.isOpen()) popup.setContent(`<div class="school-popup">${errorText}</div>`);
  });
}

const setIfOpen = (popup, html) => { if (popup.isOpen()) popup.setContent(html); };

// Expands school name suffixes for display (EL SCH, HS, MS, ...)
function formatSchoolName(name) {
  const parts = String(name || '').trim().toUpperCase().split(/\s+/);
  const last = () => parts[parts.length - 1];
  let addOn = '';
  if (last() === 'SCH') {
    parts.pop(); addOn = ' School';
    if (last() === 'EL') { parts.pop(); addOn = ' Elementary School'; }
  }
  else if (last() === 'HS')   { parts.pop(); addOn = ' High School'; }
  else if (last() === 'MS')   { parts.pop(); addOn = ' Middle School'; }
  else if (last() === 'SHS')  { parts.pop(); addOn = ' Senior High School'; }
  else if (last() === 'JSHS') { parts.pop(); addOn = ' Junior High School'; }
  else if (last() === 'CTR')  { parts.pop(); addOn = ' Center'; }
  return properCase(parts.join(' ')) + addOn;
}

// Expands intermediate district suffixes for display (ISD, RESA, ...)
function formatDistrictIU(name) {
  const suffixes = {
    ISD:  ' Intermediate School District',
    ESD:  ' Educational Service District',
    ESA:  ' Educational Service Agency',
    RESA: ' Regional Educational Service Agency',
    RESD: ' Regional Educational Service District'
  };
  const parts = String(name || '').trim().split(/\s+/);
  const suf = suffixes[parts[parts.length - 1]];
  return suf ? parts.slice(0, -1).join(' ') + suf : name;
}

async function buildFootprintPopup(latlng, props, popup) {
  // Every lookup fires in parallel
  const [county, village, mcd, district, psap, emhsd, spZone, isd, lawEnf, hospital, urgent, fireStation] =
    await Promise.all([
      queryIntersect(counties, latlng),
      queryIntersect(villages, latlng),
      queryIntersect(minorCivilDivision, latlng),
      queryIntersect(schoolDistricts, latlng),
      queryIntersect(psapBoundaries, latlng),
      queryIntersect(emshdZones, latlng),
      queryIntersect(statePoliceZones, latlng),
      queryIntersect(intermediateDistricts, latlng),   // ISD lookup
      queryNearest(localLawEnforcement, latlng, 500),
      queryNearest(hospitals, latlng, 500, isHospital),
      queryNearest(urgentCare, latlng, 500),
      // Secured layer, so this resolves to null until Washtenaw_FIRE is readable
      // (public share or FIRE_TOKEN). The row is just left out when null.
      queryNearest(fireStations, latlng, 500).catch(() => null)
    ]);

  // School / district / municipality / county
  const schoolName   = formatSchoolName(pick(props, 'NAME', 'Name'));
  const schoolType   = properCase(pick(props, 'TYPE', 'Type') || '');
  const countyName   = properCase(pick(county, 'Label', 'NAME') || 'Unknown County');
  const villageName  = pick(village, 'Label', 'NAME');
  const muniName     = pick(mcd, 'Label', 'NAME') || 'Unknown Municipality';
  const joiner       = String(muniName).split(' ')[0] === 'City' ? ' in the ' : ' in ';
  const boundaryText = villageName ? properCase(villageName) + joiner + muniName : muniName;
  const distName     = pick(district, 'Name', 'NAME') || 'Unknown School District';
  // Intermediate district comes from the ISD boundary layer, which is the same
  // source used for the fills and labels elsewhere on this map.
  const distIU = formatDistrictIU(pick(isd, 'Label', 'NAME') || 'Unknown School District Intermediate Unit');

  // PSAP / EMHSD / State Police zone
  const psapName  = properCase(pick(psap, 'DISPNAME') || 'PSAP Zone Unavailable');
  const emhsdName = properCase(pick(emhsd, 'EMHSD') || 'EMHSD District Unavailable');
  const troopName = pick(spZone, 'POST_DISTRICT') || 'State Police Troop Unavailable';

  // Nearest facilities
  const fmtNear = (r, withAddr) => r
    ? properCase(pick(r.props, 'NAME', 'Name')) + ' (' + r.miles.toFixed(2) + ' mi)' +
      (withAddr && pick(r.props, 'StreetAddr')
        ? ' located at ' + properCase(pick(r.props, 'StreetAddr')) : '')
    : 'None found';

  setIfOpen(popup, card(`${schoolType} School: ${schoolName}`, `
      <div class="sp-block">This is the School &quot;${esc(schoolName)}&quot;.
- ${esc(distName)} School District.
- Intermediate District: ${esc(distIU)}.</div>

      <div class="sp-block">Municipality: ${esc(boundaryText)}
County: ${esc(countyName)}</div>

      ${table([
        row('School Type', schoolType),
        row('ZIP Code', pick(props, 'ZIP', 'ZIPCODE', 'ZIP_CODE') || ''),
        row('Name', schoolName),
        row('County', countyName),
        row('City', properCase(pick(props, 'CITY', 'City') || '')),
        row('Street', properCase(pick(props, 'STREET', 'Street') || ''))
      ])}

      <div class="sp-block">This school is located in the ${esc(psapName)} PSAP Area, in the EMHSD District #${esc(emhsdName)}.</div>
      <div class="sp-block">The area is in the ${esc(troopName)} State Police Zone.</div>

      <h4>Nearest Facilities (distance in miles)</h4>
      ${table([
        row('Nearest Hospital', fmtNear(hospital, true)),
        row('Nearest Urgent Care', fmtNear(urgent, true)),
        row('Nearest Fire Station', fmtNear(fireStation)),
        row('Nearest Local Law Enforcement', fmtNear(lawEnf))
      ])}`));
}

const sortStrings = arr => [...arr].sort((a, b) => a.localeCompare(b));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

async function buildDistrictPopup(latlng, popup) {
  const distFeature = await queryDistrictAt(latlng);
  if (!distFeature) {
    return setIfOpen(popup, '<div class="school-popup">No school district found here.</div>');
  }

  const dProps = distFeature.properties;
  const geometry = distFeature.geometry;

  const [countyList, mcdList, spZoneList, emhsdList, psapList, isd, hospitalCount, urgentCareCount, lawEnfCount] =
    await Promise.all([
      queryIntersectAll(counties, geometry),
      queryIntersectAll(minorCivilDivision, geometry),
      queryIntersectAll(statePoliceZones, geometry),
      queryIntersectAll(emshdZones, geometry),
      queryIntersectAll(psapBoundaries, geometry),
      queryIntersect(intermediateDistricts, latlng),   // ISD lookup
      queryIntersectAll(hospitals, geometry).then(a => a.filter(isHospital).length),
      queryIntersectAll(urgentCare, geometry).then(a => a.length),
      queryIntersectAll(localLawEnforcement, geometry).then(a => a.length)
    ]);

  const district = pick(dProps, 'Name', 'NAME') || 'Unknown School District';
  // Intermediate district comes from the ISD boundary layer, the same source used
  // for the fills and labels elsewhere on this map.
  const districtIUName = pick(isd, 'Label', 'NAME') || 'Unknown Intermediate District';
  const districtIUNum  = pick(isd, 'ISD', 'ISD_1', 'ISDNUM', 'ISD_NUM', 'ISDCode', 'ISD_CODE') || '';
  const peninsula = pick(dProps, 'Peninsula');

  const counties_ = sortStrings(countyList.map(c => properCase(pick(c, 'Name', 'NAME')) + ' County'));
  const munis     = sortStrings(mcdList.map(m => pick(m, 'Label', 'NAME')).filter(Boolean));

  const distText  = `This is the ${district} School District.`;
  const iuText    = `The district is a part of the Intermediate Unit #${districtIUNum}: ${districtIUName}.`;
  const adminText = `It overlaps with a total of ${counties_.length}${counties_.length === 1 ? ' County' : ' Counties'}` +
                    ` and ${munis.length} Minor Civil Division${munis.length === 1 ? ';' : 's;'}`;

  const psapAux  = plural(psapList.length, 'Public Safety Answering Point (PSAP)',
                                           'different Public Safety Answering Points (PSAP)');
  const emhsdAux = plural(emhsdList.length, 'Emergency Management and Homeland Security Division (EMHSD).',
                                            'different Emergency Management and Homeland Security Divisions (EMHSD).');

  const spNames = spZoneList.map(sp => pick(sp, 'POST_DISTRICT')).filter(Boolean);
  const spAux = spNames.length === 0
    ? ' State Police District information not available.'
    : ' State Police District, ' + (spNames.length === 2 ? spNames.join(' and ') : spNames.join(', '));

  const psapText = `The district is covered by ${psapAux} and ${emhsdAux}`;
  const spText   = `The district is in the zone of ${spNames.length}${spAux}`;

  setIfOpen(popup, card(`School District: ${district}`, `
      ${table([
        row('Name', district),
        row('Type', 'School'),
        row('Intermediate District', districtIUName),
        row('ISD #', districtIUNum),
        peninsula ? row('Peninsula', peninsula) : '',
        row('Counties', counties_.length ? counties_.join(', ') : 'None'),
        row('Minor Civil Divisions', munis.length ? munis.join(', ') : 'None')
      ])}

      <div class="sp-block">${esc(distText)}
${esc(iuText)}</div>

      <div class="sp-block">${esc(adminText)}</div>

      <h4>Emergency Responders and Law Enforcement within boundaries</h4>
      <div class="sp-block">${esc(psapText)}</div>
      <div class="sp-block">${esc(spText)}</div>

      ${table([
        row('Hospitals', hospitalCount),
        row('Urgent Care Clinics', urgentCareCount),
        row('Local Law Enforcement Locations', lawEnfCount)
      ])}`));
}

}

// ============================================================================
// CLICK HANDLER - facility marker, else school, else district
// ============================================================================
map.on('click', async e => {
  // The directions widget takes the click while a waypoint is being picked.
  if (window.__dwPickClick && window.__dwPickClick(e.latlng)) return;

  const z = map.getZoom();
  const latlng = e.latlng;

  // Facility layers sit on top of the school layers, so they get first look. All
  // are queried together and the closest hit wins - a fixed priority order would
  // let the topmost layer swallow clicks meant for a neighbouring marker where
  // symbols overlap.
  const candidates = [
    { layer: hospitals,           build: buildHospitalPopup },
    { layer: urgentCare,          build: buildUrgentCarePopup },
    { layer: localLawEnforcement, build: buildLocalLawEnforcementPopup },
    { layer: fireStations,        build: buildFirePopup }
  ].filter(() => z >= FACILITY_MIN_ZOOM);

  if (candidates.length) {
    const tolMiles = pixelsToMeters(CLICK_TOLERANCE_PX + 4) / MI;
    const hits = await Promise.all(candidates.map(c =>
      queryNearest(c.layer, latlng, tolMiles)
        .then(r => {
          // The popup queries the service directly, so non-hospital units get
          // screened out here too.
          if (!r) return null;
          if (c.layer === hospitals && !isHospital(r.props)) return null;
          return { ...r, build: c.build };
        })
        .catch(() => null)));

    const closest = hits.reduce((best, h) => (h && (!best || h.miles < best.miles) ? h : best), null);
    if (closest) {
      return openPopup(latlng, { maxWidth: 340 }, 'Loading facility details',
        popup => closest.build(latlng, closest.props, popup),
        'Could not load facility details. Try again.');
    }
  }

  // Zoomed in far enough to be pointing at a school: footprints are the visible
  // layer past FOOTPRINT_ZOOM, otherwise it is the school points layer. Footprint
  // hit-testing is exact point-in-polygon, so a click just off a building edge -
  // or a school with no digitized outline - returns nothing and would fall through
  // to the district popup. The tolerant point lookup catches those cases without
  // weakening the footprint check when it does succeed.
  if (z >= POINTS_MIN_ZOOM) {
    const props = z >= FOOTPRINT_ZOOM
      ? (await queryFootprintAt(latlng)) || (await querySchoolPointAt(latlng))
      : await querySchoolPointAt(latlng);
    if (props) {
      return openPopup(latlng, { maxWidth: 360, maxHeight: 420 }, 'Loading school details',
        popup => buildFootprintPopup(latlng, props, popup),
        'Could not load school details. Try again.');
    }
  }

  // Nothing under the click, or too zoomed out: fall back to the district popup.
  openPopup(latlng, { maxWidth: 380, maxHeight: 460 }, 'Loading school district',
    popup => buildDistrictPopup(latlng, popup),
    'Could not load school district details. Try again.');
});
